<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STEEL MERIDIAN</title>
<meta name="description" content="STEEL MERIDIAN - a browser tactical FPS. Single file, three.js, procedural art and audio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   STYLE
   ===================================================================== */
:root {
  --ui-font: "Rajdhani", "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Arial Narrow", sans-serif;
  --mono: "Share Tech Mono", "Consolas", "Menlo", monospace;
  --bg-deep: #07090b;
  --panel: rgba(14, 17, 20, 0.88);
  --panel-2: rgba(24, 29, 34, 0.92);
  --line: rgba(255, 255, 255, 0.09);
  --line-2: rgba(255, 255, 255, 0.18);
  --text: #e6e8e3;
  --text-dim: #8d949a;
  --accent: #d8b24a;
  --accent-dim: rgba(216, 178, 74, 0.18);
  --friendly: #59a8ff;
  --enemy: #ff4d4d;
  --good: #8fd16a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg-deep); color: var(--text); font-family: var(--ui-font); user-select: none; -webkit-user-select: none; }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
.hidden { display: none !important; }
button { font-family: inherit; }

/* ---------- loading ---------- */
#loading { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  background: radial-gradient(ellipse at 50% 40%, #1a2026 0%, #07090b 70%); }
#loading .brand { font-size: 64px; font-weight: 700; letter-spacing: 14px; color: var(--text); text-shadow: 0 0 30px rgba(216,178,74,0.25); }
#loading .brand span { color: var(--accent); }
#loading .bar { width: min(420px, 70vw); height: 4px; background: rgba(255,255,255,0.08); position: relative; overflow: hidden; }
#loading .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: var(--accent); transition: width .15s; }
#loading .status { font-family: var(--mono); font-size: 13px; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; min-height: 18px; }
#loading .err { color: #ff7b7b; font-family: var(--mono); font-size: 13px; max-width: 640px; text-align: center; line-height: 1.5; }

/* ---------- screens / menus ---------- */
.screen { position: fixed; inset: 0; z-index: 30; display: flex; }
#menu { background: linear-gradient(90deg, rgba(5,7,9,0.92) 0%, rgba(5,7,9,0.7) 34%, rgba(5,7,9,0.0) 62%); }
.menu-col { width: min(460px, 92vw); padding: 7vh 0 5vh 6vw; display: flex; flex-direction: column; }
.logo { font-size: 58px; font-weight: 700; letter-spacing: 10px; line-height: 0.95; }
.logo span { color: var(--accent); display: block; font-size: 22px; letter-spacing: 9px; margin-top: 10px; font-weight: 600; }
.menu-list { margin-top: 6vh; display: flex; flex-direction: column; gap: 6px; }
.mbtn { position: relative; text-align: left; background: transparent; border: none; border-left: 3px solid transparent; color: var(--text); font-size: 26px; font-weight: 600; letter-spacing: 3px;
  padding: 8px 16px; cursor: pointer; text-transform: uppercase; transition: background .12s, border-color .12s, color .12s, padding .12s; }
.mbtn:hover:not([disabled]) { background: linear-gradient(90deg, var(--accent-dim), transparent); border-left-color: var(--accent); padding-left: 22px; }
.mbtn small { display: block; font-size: 13px; letter-spacing: 2px; color: var(--text-dim); font-weight: 500; margin-top: -2px; }
.mbtn[disabled] { color: #5a6066; cursor: not-allowed; }
.mbtn[disabled] small { color: #4a5056; }
.mbtn.soon { color: #7d848a; }
.mbtn.soon small { color: var(--accent); opacity: 0.7; }
.mbtn.soon:hover { color: #aeb4b8; border-left-color: #5a6066; background: linear-gradient(90deg, rgba(255,255,255,0.05), transparent); }
#toast { position: fixed; right: 4vw; bottom: 6vh; transform: translateY(12px); z-index: 60; background: var(--panel); border: 1px solid var(--line-2); border-left: 3px solid var(--accent);
  padding: 12px 20px; font-size: 18px; letter-spacing: 1px; color: var(--text); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 90vw; }
#toast.on { opacity: 1; transform: translateY(0); }
.menu-foot { margin-top: auto; font-family: var(--mono); font-size: 12px; color: var(--text-dim); letter-spacing: 1px; line-height: 1.7; }

.overlay { background: rgba(4,6,8,0.72); backdrop-filter: blur(3px); align-items: center; justify-content: center; }
.panel { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,0.6); padding: 26px 30px; min-width: 360px; max-width: 92vw; max-height: 90vh; overflow: auto; }
.panel h2 { margin: 0 0 18px; font-size: 30px; letter-spacing: 6px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
.panel h2::before { content: ""; width: 6px; height: 26px; background: var(--accent); display: inline-block; }
.panel .row-btns { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--line-2); padding: 10px 22px; font-size: 18px; font-weight: 600; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; }
.btn:hover { border-color: var(--accent); color: #fff; background: rgba(216,178,74,0.12); }
.btn.primary { background: var(--accent); color: #111; border-color: var(--accent); }
.btn.primary:hover { background: #ebc75c; color: #000; }
.btn.danger:hover { border-color: var(--enemy); background: rgba(255,77,77,0.12); }
.pause-list { display: flex; flex-direction: column; gap: 8px; min-width: 300px; }
.pause-list .btn { text-align: left; }

/* settings */
#settingsPanel { width: 760px; }
.tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: none; color: var(--text-dim); font-size: 18px; letter-spacing: 3px; padding: 8px 16px; cursor: pointer; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.set-row { display: grid; grid-template-columns: 220px 1fr 70px; align-items: center; gap: 14px; padding: 9px 4px; border-bottom: 1px solid var(--line); }
.set-row label { font-size: 17px; letter-spacing: 1px; color: #cfd3d6; font-weight: 600; }
.set-row .val { font-family: var(--mono); font-size: 14px; color: var(--accent); text-align: right; }
.set-row input[type=range] { width: 100%; accent-color: var(--accent); }
.seg { display: flex; gap: 4px; }
.seg button { flex: 1; background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--line); padding: 6px 8px; font-size: 15px; letter-spacing: 2px; cursor: pointer; font-weight: 600; }
.seg button.on { color: #111; background: var(--accent); border-color: var(--accent); }
.keys { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 30px; }
.key-row { display: flex; justify-content: space-between; padding: 6px 2px; border-bottom: 1px solid var(--line); font-size: 16px; }
.key-row kbd { font-family: var(--mono); background: var(--panel-2); border: 1px solid var(--line-2); padding: 1px 8px; font-size: 13px; color: var(--accent); }
.note { font-family: var(--mono); font-size: 12px; color: var(--text-dim); margin-top: 12px; line-height: 1.6; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
#crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transition: opacity .08s; }
#crosshair i { position: absolute; background: rgba(255,255,255,0.92); box-shadow: 0 0 2px rgba(0,0,0,0.9); }
#crosshair .ct, #crosshair .cb { width: 2px; height: 9px; left: -1px; }
#crosshair .cl, #crosshair .cr { width: 9px; height: 2px; top: -1px; }
#crosshair .cd { width: 2px; height: 2px; left: -1px; top: -1px; }
#hitmarker { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; }
#hitmarker i { position: absolute; width: 2px; height: 10px; background: #fff; box-shadow: 0 0 2px rgba(0,0,0,0.8); left: -1px; top: -5px; }
#hitmarker.kill i { background: var(--enemy); }
#ammo { position: absolute; right: 42px; bottom: 34px; text-align: right; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
#ammo .wname { font-size: 17px; letter-spacing: 3px; color: #d6d9d4; font-weight: 600; }
#ammo .wmode { font-size: 13px; letter-spacing: 3px; color: var(--text-dim); font-family: var(--mono); }
#ammo .count { font-family: var(--mono); line-height: 1; margin-top: 4px; }
#ammo .mag { font-size: 54px; color: #fff; }
#ammo .mag.low { color: var(--enemy); }
#ammo .res { font-size: 24px; color: var(--text-dim); margin-left: 4px; }
#ammo .pips { display: flex; justify-content: flex-end; gap: 2px; margin-top: 6px; height: 10px; }
#ammo .pips b { width: 3px; height: 10px; background: rgba(255,255,255,0.85); }
#ammo .pips b.e { background: rgba(255,255,255,0.15); }
#centerMsg { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); font-size: 20px; font-weight: 700; letter-spacing: 4px; color: #fff; text-shadow: 0 1px 4px #000; opacity: 0; transition: opacity .15s; }
#centerMsg.warn { color: var(--accent); }
#fps { position: absolute; left: 10px; top: 8px; font-family: var(--mono); font-size: 12px; color: #9fe39f; text-shadow: 0 1px 2px #000; white-space: pre; }
#rangeInfo { position: absolute; left: 24px; top: 24px; width: 290px; background: rgba(8,10,12,0.55); border-left: 3px solid var(--accent); padding: 12px 16px; transition: opacity .6s; }
#rangeInfo h3 { margin: 0 0 6px; font-size: 18px; letter-spacing: 4px; }
#rangeInfo p { margin: 0; font-family: var(--mono); font-size: 12px; color: #c2c7cb; line-height: 1.65; }
#rangeStats { position: absolute; left: 24px; bottom: 30px; font-family: var(--mono); font-size: 13px; color: #cfd3d6; text-shadow: 0 1px 2px #000; line-height: 1.6; }
#dmgLayer { position: absolute; inset: 0; overflow: hidden; }
.dmgnum { position: absolute; font-family: var(--mono); font-weight: 700; font-size: 18px; color: #fff; text-shadow: 0 1px 2px #000, 0 0 6px rgba(0,0,0,0.6); will-change: transform, opacity; }
.dmgnum.head { color: #ffd34d; }
.dmgnum.kill { color: var(--enemy); font-size: 22px; }
#clickToPlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.35); cursor: pointer; font-size: 22px; letter-spacing: 5px; font-weight: 700; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>

<!-- ============ LOADING ============ -->
<div id="loading">
  <div class="brand">STEEL <span>MERIDIAN</span></div>
  <div class="bar"><i id="loadBar"></i></div>
  <div class="status" id="loadStatus">Initialising</div>
  <div class="err hidden" id="loadErr"></div>
</div>

<!-- ============ MAIN MENU ============ -->
<div id="menu" class="screen hidden">
  <div class="menu-col">
    <div class="logo">STEEL<br>MERIDIAN<span>URBAN WARFARE</span></div>
    <div class="menu-list">
      <button class="mbtn" data-action="range">Firing Range<small>Map: Salt Market &middot; free practice</small></button>
      <button class="mbtn soon" data-action="soon" data-soon="Online play (room browser, 3v3 with bots filling slots) arrives in Phase 6.">Play Online<small>Coming in Phase 6</small></button>
      <button class="mbtn soon" data-action="soon" data-soon="Practice vs Bots (3v3 Team Deathmatch) arrives in Phase 3.">Practice vs Bots<small>Coming in Phase 3</small></button>
      <button class="mbtn soon" data-action="soon" data-soon="Create-a-Class arrives in Phase 4 (after all weapons and attachments land in Phase 2).">Create-a-Class<small>Coming in Phase 4</small></button>
      <button class="mbtn soon" data-action="soon" data-soon="Barracks (levels, unlocks and stats) arrives in Phase 4.">Barracks<small>Coming in Phase 4</small></button>
      <button class="mbtn" data-action="settings">Settings<small>Controls, graphics, audio</small></button>
    </div>
    <div class="menu-foot" id="menuFoot"></div>
  </div>
</div>

<!-- ============ PAUSE ============ -->
<div id="pause" class="screen overlay hidden">
  <div class="panel">
    <h2>PAUSED</h2>
    <div class="pause-list">
      <button class="btn primary" data-action="resume">Resume</button>
      <button class="btn" data-action="settings">Settings</button>
      <button class="btn danger" data-action="quit">Quit to Menu</button>
    </div>
  </div>
</div>

<!-- ============ SETTINGS ============ -->
<div id="settings" class="screen overlay hidden">
  <div class="panel" id="settingsPanel">
    <h2>SETTINGS</h2>
    <div class="tabs" id="setTabs"></div>
    <div id="setBody"></div>
    <div class="row-btns">
      <button class="btn primary" data-action="settings-close">Back</button>
      <button class="btn danger" data-action="settings-reset">Reset All Data</button>
    </div>
  </div>
</div>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <div id="dmgLayer"></div>
  <div id="crosshair"><i class="ct"></i><i class="cb"></i><i class="cl"></i><i class="cr"></i><i class="cd"></i></div>
  <div id="hitmarker"><i style="transform:rotate(45deg) translateY(-9px)"></i><i style="transform:rotate(135deg) translateY(-9px)"></i><i style="transform:rotate(225deg) translateY(-9px)"></i><i style="transform:rotate(315deg) translateY(-9px)"></i></div>
  <div id="ammo">
    <div class="wname" id="wName">-</div>
    <div class="wmode" id="wMode">AUTO</div>
    <div class="count"><span class="mag" id="wMag">30</span><span class="res" id="wRes">/ 120</span></div>
    <div class="pips" id="wPips"></div>
  </div>
  <div id="centerMsg"></div>
  <div id="rangeInfo">
    <h3>FIRING RANGE</h3>
    <p>WASD move &middot; SHIFT sprint<br>C crouch (slide while sprinting)<br>SPACE jump &middot; R reload<br>RMB aim &middot; LMB fire<br>Targets respawn after 3s.<br>ESC pause / settings</p>
  </div>
  <div id="rangeStats"></div>
  <div id="fps" class="hidden"></div>
</div>
<div id="clickToPlay" class="hidden">CLICK TO CONTINUE</div>
<div id="toast"></div>

<!-- Boot watchdog: if the engine modules never load (CDN blocked/offline), say so instead of hanging. -->
<script>
  window.__SM_BOOT_TIMER = setTimeout(function () {
    if (window.__SM_BOOTED) return;
    var e = document.getElementById('loadErr');
    e.classList.remove('hidden');
    e.textContent = 'Could not load the 3D engine from the CDN (cdn.jsdelivr.net). Check your connection or ad-blocker and reload.';
  }, 20000);
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>

<script type="module">
/* =====================================================================
   STEEL MERIDIAN
   One-file browser FPS. Sections:
     CONFIG · DATA · UTIL · SAVE · AUDIO · RENDER · TEXTURES · MATERIALS
     COLLISION · MAP · FX · INPUT · PLAYER · VIEWMODEL · WEAPONS
     ACTORS (soldier model, hitboxes, range targets) · BOTS · NET · UI · GAME
   ===================================================================== */
import * as THREE from 'three';
import { Octree } from 'three/addons/math/Octree.js';
import { Capsule } from 'three/addons/math/Capsule.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { Pass } from 'three/addons/postprocessing/Pass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { FXAAPass } from 'three/addons/postprocessing/FXAAPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

window.__SM_BOOTED = true;
clearTimeout(window.__SM_BOOT_TIMER);

/* =====================================================================
   CONFIG — every tuning value lives here
   ===================================================================== */
const CONFIG = {
  VERSION: '0.1.1-phase1',
  SAVE_KEY: 'steelmeridian.save.v1',
  SAVE_VERSION: 1,

  WORLD: {
    sunElevation: 46, sunAzimuth: 218,          // degrees
    sunColor: 0xfff0dc, sunIntensity: 3.1,
    hemiSky: 0xbcd2ea, hemiGround: 0x6e6455, hemiIntensity: 0.3,
    envIntensity: 0.2, skyIntensity: 0.42,         // sky radiance is ~1-2 linear: scale IBL so sun:sky is ~4:1
    skyClamp: 60,                                   // cap on sky HDR (the sun disc) so its bloom stays a glint, not a white-out
    fogColor: 0xa3aeb8, fogDensity: 0.0065,
    exposure: 0.92,
    bounds: { minX: -36, maxX: 36, minZ: -48, maxZ: 48, maxY: 18 },
  },

  CAMERA: { near: 0.07, far: 520, vmNear: 0.01, vmFov: 56, sprintFovAdd: 4, slideFovAdd: 7 },

  PHYSICS: { gravity: 21, maxSubstep: 1 / 120, groundNormalY: 0.6, followNormalY: 0.82, snapDown: 0.32, killY: -20 },

  MOVE: {
    radius: 0.32,
    standHeight: 1.80, crouchHeight: 1.20, slideHeight: 1.0,
    eyeStand: 1.64, eyeCrouch: 1.06, eyeSlide: 0.86,
    walkSpeed: 4.75, sprintSpeed: 7.1, crouchSpeed: 2.45,
    backpedalMult: 0.82, strafeMult: 0.92,
    groundAccel: 58, groundDecel: 46, airAccel: 9, airMaxSpeedBonus: 0.35,
    jumpVelocity: 6.35, coyoteTime: 0.11, jumpBuffer: 0.13, landJumpCooldown: 0.12,
    crouchLerp: 11,
    slideMinSpeed: 5.6, slideBoost: 9.4, slideDuration: 0.82, slideFriction: 6.5, slideSteer: 2.2, slideCooldown: 0.35, slideRoll: 4.5,
    sprintMinForward: 0.55,
  },

  BOB: {
    walkFreq: 1.75, sprintFreq: 2.25, crouchFreq: 1.45, // strides (full cycles) per second at nominal speed
    walkAmpY: 0.022, walkAmpX: 0.012, sprintAmpY: 0.045, sprintAmpX: 0.028, crouchAmpY: 0.012,
    roll: 0.35,                                // degrees of camera roll per bob cycle
    landDipPerMs: 0.0115, landDipMax: 0.16,    // landing camera dip per m/s of impact speed
    stepWalk: 1.95, stepSprint: 2.35, stepCrouch: 1.4, // metres per footstep
  },

  VIEWMODEL: {
    hipPos: [0.098, -0.132, -0.355], hipRot: [0.02, 0.065, -0.02],
    sprintPos: [0.07, -0.165, -0.36], sprintRot: [-0.48, 0.42, 0.55],
    crouchOffset: [-0.012, 0.006, 0.006], crouchRoll: -0.06,
    adsSightDist: 0.165,
    swayLook: 0.00042, swayMax: 0.075, swayStiff: 140, swayDamp: 15, swayAdsMult: 0.22,
    bobPosX: 0.010, bobPosY: 0.008, bobRot: 0.022, bobSprintMult: 2.4, bobAdsMult: 0.12,
    breathe: 0.0025, strafeRoll: 0.05, jumpKick: 0.022,
    kickStiff: 420, kickDamp: 24, rotStiff: 360, rotDamp: 22,
  },

  INPUT: { mouseScale: 0.00052, maxDelta: 450 },

  FX: {
    maxParticlesAdd: 700, maxParticlesAlpha: 900, decalsPerType: 96, decalLife: 40, shellPool: 24,
    tracerSpeed: 520, tracerLength: 3.2, tracerWidth: 0.022, tracerChance: 1.0,
    muzzleLight: 9, muzzleLightRange: 7, muzzleFlashTime: 0.045,
  },

  RANGE: { targetRespawn: 3.0, infiniteReserve: true },

  GFX_PRESETS: {
    low:    { label: 'LOW',    resScale: 0.75, maxDpr: 1.0, shadows: true, shadowSize: 1024, shadowRadius: 1.4, ssao: false, aa: 'fxaa', bloom: true, bloomStrength: 0.3, anisotropy: 2 },
    medium: { label: 'MEDIUM', resScale: 1.0,  maxDpr: 1.0, shadows: true, shadowSize: 2048, shadowRadius: 2.2, ssao: false, aa: 'smaa', bloom: true, bloomStrength: 0.32, anisotropy: 4 },
    high:   { label: 'HIGH',   resScale: 1.0,  maxDpr: 1.5, shadows: true, shadowSize: 4096, shadowRadius: 2.6, ssao: true,  aa: 'smaa', bloom: true, bloomStrength: 0.34, anisotropy: 8 },
  },

  // bloom works on linear HDR: sunlit walls sit near 1.0, so only flashes, sparks, tracers, lamps and the sun cross 2.4
  POST: { bloomThreshold: 2.4, bloomRadius: 0.42 },

  AUDIO: { masterDefault: 0.8, reverbSend: 0.22, footstepVolume: 0.55 },

  TEX_SIZE: 512,
};

/* =====================================================================
   DATA — surfaces, weapons, default settings, key bindings
   ===================================================================== */
const SURF = { CONCRETE: 0, BRICK: 1, METAL: 2, WOOD: 3, DIRT: 4, ASPHALT: 5, GLASS: 6, FLESH: 7, SAND: 8, PLASTER: 9, TILE: 10 };
const SURF_NAMES = Object.keys(SURF);
// Collision triangle flags
const CF = { NO_BULLET: 1, NO_PLAYER: 2, DECAL: 4 };

// FX per surface: dust colour, spark, chips, decal type, footstep voice
const SURF_FX_SRGB = {
  [SURF.CONCRETE]: { dust: [0.62, 0.6, 0.56], spark: 0.15, chips: [0.5, 0.49, 0.46], decal: 'stone', step: 'concrete' },
  [SURF.BRICK]:    { dust: [0.58, 0.40, 0.31], spark: 0.10, chips: [0.48, 0.25, 0.18], decal: 'stone', step: 'concrete' },
  [SURF.PLASTER]:  { dust: [0.78, 0.74, 0.66], spark: 0.0,  chips: [0.82, 0.78, 0.7], decal: 'stone', step: 'concrete' },

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Damped spring (scalar). Sub-steps internally so stiff springs stay stable at low frame rates. */
class Spring {
  constructor(k = 200, d = 20) { this.k = k; this.d = d; this.x = 0; this.v = 0; }
  update(dt, target = 0) {
    const steps = Math.max(1, Math.ceil(dt / (1 / 240)));
    const h = dt / steps;
    for (let i = 0; i < steps; i++) {
      const a = -this.k * (this.x - target) - this.d * this.v;
      this.v += a * h; this.x += this.v * h;
    }
    return this.x;
  }
  reset() { this.x = 0; this.v = 0; }
}

   AUDIO — everything synthesised with Web Audio.
   Buffers are pre-rendered with OfflineAudioContext during loading (no user
   gesture needed); the live AudioContext is created on the first click.
   ===================================================================== */
const SR = 44100;

function makeNoise(oc, seconds, seed = 1, channels = 1, color = 'white') {
  const len = Math.max(1, Math.floor(seconds * oc.sampleRate));
  const buf = oc.createBuffer(channels, len, oc.sampleRate);
  for (let c = 0; c < channels; c++) {
    const rnd = mulberry32(seed * 7919 + c * 104729);
    const d = buf.getChannelData(c);
    let b0 = 0, b1 = 0, b2 = 0, last = 0;
    for (let i = 0; i < len; i++) {
      const w = rnd() * 2 - 1;
      if (color === 'pink') {
        b0 = 0.99765 * b0 + w * 0.0990460; b1 = 0.96300 * b1 + w * 0.2965164; b2 = 0.57000 * b2 + w * 1.0526913;
        d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.2;
      } else if (color === 'brown') {
        last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5;
      } else d[i] = w;
    }
  }
  return buf;
}
function envAD(param, t0, peak, attack, decay, floor = 0.0001) {
  param.setValueAtTime(floor, t0);
  param.linearRampToValueAtTime(peak, t0 + attack);
  param.exponentialRampToValueAtTime(floor, t0 + attack + decay);
}
function distCurve(amount) {
  const n = 1024, c = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = (i / (n - 1)) * 2 - 1; c[i] = Math.tanh(x * amount) / Math.tanh(amount); }
  return c;
}
function noiseSrc(oc, buf, t = 0) { const s = oc.createBufferSource(); s.buffer = buf; s.start(t); return s; }
function filt(oc, type, freq, Q = 0.707, gain = 0) { const f = oc.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = Q; f.gain.value = gain; return f; }

async function renderOffline(seconds, channels, build, normalize = 0.9) {
  const oc = new OfflineAudioContext(channels, Math.ceil(seconds * SR), SR);
  build(oc, oc.destination);
  const buf = await oc.startRendering();
  if (normalize) {
    let peak = 0;
    for (let c = 0; c < buf.numberOfChannels; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; } }
    if (peak > 0) { const g = normalize / peak; for (let c = 0; c < buf.numberOfChannels; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= g; } }
  }
  return buf;
}

const SoundBank = {
  // --- weapon report --------------------------------------------------
  gunshot(p, suppressed, seed) {
    const r = mulberry32(seed);
    const j = (v, amt = 0.06) => v * (1 + (r() * 2 - 1) * amt);
    return renderOffline(1.25, 2, (oc, dst) => {
      const out = oc.createGain(); out.gain.value = 1;
      const comp = oc.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 4; comp.ratio.value = 6; comp.attack.value = 0.0006; comp.release.value = 0.09;
      out.connect(comp).connect(dst);
      const white = makeNoise(oc, 1.3, seed, 2);
      const sup = suppressed ? 1 : 0;
      // 1) supersonic crack / muzzle transient
      if (!sup) {
        const n = noiseSrc(oc, white); const hp = filt(oc, 'highpass', j(2400)); const pk = filt(oc, 'peaking', j(5200), 1.2, 6);
        const g = oc.createGain(); envAD(g.gain, 0, p.crack, 0.0006, j(0.028));
        n.connect(hp).connect(pk).connect(g).connect(out);

      const o = oc.createOscillator(); o.type = 'sine';

      const sh = oc.createWaveShaper(); sh.curve = distCurve(p.drive); sh.oversample = '2x';
      const og = oc.createGain(); envAD(og.gain, 0, p.body * (sup ? 0.55 : 1), 0.0015, j(p.decay) * 1.3);
      o.connect(sh).connect(filt(oc, 'lowpass', 1100)).connect(og).connect(out); o.start(0); o.stop(1.0);
      // 3) blast — broadband noise with a falling lowpass
      { const n = noiseSrc(oc, white); const lp = filt(oc, 'lowpass', sup ? 1700 : j(p.blastHz), 0.9);
        lp.frequency.exponentialRampToValueAtTime(sup ? 380 : 520, j(p.decay) * 1.8);
        const g = oc.createGain(); envAD(g.gain, 0, p.blast * (sup ? 0.5 : 1), 0.001, j(p.decay) * (sup ? 1.0 : 1.7));

        const g = oc.createGain(); envAD(g.gain, 0, 0.9, 0.002, 0.07); n.connect(bp).connect(g).connect(out); }

        n.connect(bp).connect(g).connect(out);

const AudioSys = {
  ctx: null, master: null, sfx: null, ui: null, amb: null, reverbIn: null, comp: null,
  buffers: {}, voices: 0, maxVoices: 56, ambSrc: null,
  async prebuild(onProgress) {
    const jobs = [];
    const add = (name, promiseFactory) => jobs.push([name, promiseFactory]);
    for (const w of Object.values(WEAPONS)) {
      for (let i = 0; i < 3; i++) add('shot_' + w.id, () => SoundBank.gunshot(w.sound, false, 100 + i * 17));
      for (let i = 0; i < 2; i++) add('shotS_' + w.id, () => SoundBank.gunshot(w.sound, true, 300 + i * 17));
    }
    add('dryfire', () => SoundBank.sequence(0.12, [[0, 3200, 6, 0.02, 1], [0.03, 1900, 5, 0.03, 0.6]], 5));
    add('magout', () => SoundBank.sequence(0.4, [[0, 2600, 5, 0.025, 1], [0.03, 1500, 1.5, 0.12, 0.45], [0.18, 900, 2, 0.05, 0.3]], 11));
    add('magin', () => SoundBank.sequence(0.35, [[0, 1700, 3, 0.04, 0.8], [0.0, 300, 1, 0.05, 0.7, 'lowpass'], [0.075, 2900, 4, 0.03, 1]], 12));
    add('boltpull', () => SoundBank.sequence(0.3, [[0, 2200, 4, 0.02, 0.8], [0.02, 3100, 5, 0.012, 0.5], [0.04, 3300, 5, 0.012, 0.5], [0.06, 1400, 1.5, 0.12, 0.35]], 13));
    add('boltrelease', () => SoundBank.sequence(0.3, [[0, 2400, 3, 0.035, 1], [0, 220, 1, 0.07, 0.9, 'lowpass'], [0.012, 4200, 4, 0.02, 0.4]], 14));
    add('rattle', () => SoundBank.sequence(0.25, [[0, 3600, 6, 0.015, 0.5], [0.04, 2800, 6, 0.015, 0.4], [0.09, 3900, 6, 0.012, 0.3]], 15));
    for (const k of ['concrete', 'metal', 'wood', 'dirt']) for (let i = 0; i < 4; i++) add('step_' + k, () => SoundBank.footstep(k, 500 + i * 31 + k.length * 7));
    for (const k of ['stone', 'metal', 'wood', 'dirt', 'flesh']) for (let i = 0; i < 3; i++) add('imp_' + k, () => SoundBank.impact(k, 700 + i * 13 + k.length));
    for (let i = 0; i < 3; i++) add('shell', () => SoundBank.shell(900 + i * 7));
    add('hit', () => SoundBank.tick(2350, 0.035, false));
    add('hithead', () => SoundBank.tick(3100, 0.05, false));
    add('kill', () => SoundBank.tick(1250, 0.07, true));
    for (let i = 0; i < 3; i++) add('cloth', () => SoundBank.cloth(1000 + i, 0.2 + i * 0.03));
    add('gear', () => SoundBank.cloth(1100, 0.16, 2400));
    add('slide', () => SoundBank.slide(1200));
    for (let i = 0; i < 2; i++) add('land', () => SoundBank.land(1300 + i));
    add('jump', () => SoundBank.cloth(1400, 0.18, 1700));
    add('ui', () => SoundBank.tick(1800, 0.02, false));
    add('wind', () => SoundBank.wind());
    add('thud', () => SoundBank.sequence(0.35, [[0, 160, 1, 0.18, 1, 'lowpass'], [0.01, 900, 1.2, 0.06, 0.4]], 21));
    let done = 0;
    // render a few in parallel to keep loading short
    const queue = jobs.slice();
    const worker = async () => {
      while (queue.length) {
        const [name, fn] = queue.shift();
        const buf = await fn();
        (this.buffers[name] ||= []).push(buf);
        done++; onProgress && onProgress(done / jobs.length);

  },
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = this.ctx = new AC({ latencyHint: 'interactive' });
    this.master = ctx.createGain();
    this.comp = ctx.createDynamicsCompressor();
    this.comp.threshold.value = -8; this.comp.knee.value = 6; this.comp.ratio.value = 10; this.comp.attack.value = 0.002; this.comp.release.value = 0.12;
    this.master.connect(this.comp).connect(ctx.destination);
    this.sfx = ctx.createGain(); this.sfx.connect(this.master);
    this.ui = ctx.createGain(); this.ui.connect(this.master);
    this.amb = ctx.createGain(); this.amb.gain.value = 0.22; this.amb.connect(this.master);
    // urban reverb: synthetic impulse with early reflections
    const conv = ctx.createConvolver();
    const len = Math.floor(ctx.sampleRate * 1.6), ir = ctx.createBuffer(2, len, ctx.sampleRate);

      for (const er of [0.019, 0.031, 0.047, 0.066, 0.089]) { const k = Math.floor(er * ctx.sampleRate * (1 + c * 0.04)); if (k < len) d[k] += (rnd() > 0.5 ? 1 : -1) * 0.6; }
    }
    conv.buffer = ir;
    this.reverbIn = ctx.createGain(); const rv = ctx.createGain(); rv.gain.value = 0.55;

  },
  setVolume(v) { if (this.master) this.master.gain.value = v * v * 1.1; },
  startAmbience() {
    if (!this.ctx || this.ambSrc || !this.buffers.wind) return;
    const s = this.ctx.createBufferSource(); s.buffer = this.buffers.wind[0]; s.loop = true; s.connect(this.amb); s.start();
    this.ambSrc = s;
  },
  stopAmbience() { if (this.ambSrc) { try { this.ambSrc.stop(); } catch (e) {} this.ambSrc.disconnect(); this.ambSrc = null; } },
  /** Play a buffer. opts: vol, rate, rateVar, delay, send, bus ('sfx'|'ui'), pos (Vector3 for 3D), ref, rolloff */
  play(name, o = {}) {
    const ctx = this.ctx; if (!ctx || ctx.state !== 'running') return null;
    const list = this.buffers[name]; if (!list) return null;
    if (this.voices >= this.maxVoices && !o.important) return null;
    const src = ctx.createBufferSource();
    src.buffer = list[(Math.random() * list.length) | 0];
    const rv = o.rateVar ?? 0.035;
    src.playbackRate.value = (o.rate || 1) * (1 + (Math.random() * 2 - 1) * rv);
    const g = ctx.createGain(); g.gain.value = o.vol ?? 1;
    src.connect(g);

      pan = ctx.createPanner();

      else pan.setPosition(o.pos.x, o.pos.y, o.pos.z);
      g.connect(pan); node = pan;
    }
    node.connect(o.bus === 'ui' ? this.ui : this.sfx);
    let sg = null;
    const send = o.send ?? CONFIG.AUDIO.reverbSend;
    if (send > 0) { sg = ctx.createGain(); sg.gain.value = send; node.connect(sg); sg.connect(this.reverbIn); }
    src.start(ctx.currentTime + (o.delay || 0));

  },
  updateListener(cam) {
    const ctx = this.ctx; if (!ctx) return;
    const L = ctx.listener;

    cam.getWorldDirection(_v1);
    _v2.set(0, 1, 0).applyQuaternion(cam.quaternion);

      L.positionX.value = p.x; L.positionY.value = p.y; L.positionZ.value = p.z;

      L.upX.value = _v2.x; L.upY.value = _v2.y; L.upZ.value = _v2.z;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(CONFIG.WORLD.fogColor, CONFIG.WORLD.fogDensity);

const sunDir = new THREE.Vector3().setFromSphericalCoords(1, (90 - CONFIG.WORLD.sunElevation) * DEG, CONFIG.WORLD.sunAzimuth * DEG);

// Fixed pool of world point lights (muzzle flashes, explosions). The count never
// changes at runtime so shaders never recompile mid-game.
const FXLights = {
  lights: [], next: 0,
  init() {
    for (let i = 0; i < 3; i++) { const l = new THREE.PointLight(0xffaa55, 0, CONFIG.FX.muzzleLightRange, 2); l.userData.t = 0; l.userData.dur = 0.05; l.userData.peak = 0; scene.add(l); this.lights.push(l); }
  },
  flash(pos, color, intensity, range, dur) {
    const l = this.lights[this.next]; this.next = (this.next + 1) % this.lights.length;
    l.position.copy(pos); l.color.setHex(color); l.distance = range; l.userData.t = dur; l.userData.dur = dur; l.userData.peak = intensity; l.intensity = intensity;
  },
  update(dt) {
    for (const l of this.lights) {
      if (l.userData.t > 0) { l.userData.t -= dt; const k = Math.max(0, l.userData.t / l.userData.dur); l.intensity = l.userData.peak * k * k; }
      else l.intensity = 0;
    }
  },
};
FXLights.init();

/** Sky dome rendered once into a cube map (background), and once without the sun disc into PMREM (IBL). */
function buildSkyAndEnvironment() {
  const sky = new Sky();
  sky.scale.setScalar(400);
  const u = sky.material.uniforms;
  u.turbidity.value = 3.0; u.rayleigh.value = 1.3; u.mieCoefficient.value = 0.0025; u.mieDirectionalG.value = 0.76;
  sky.material.fragmentShader = sky.material.fragmentShader.replace('gl_FragColor = vec4( texColor, 1.0 );', `gl_FragColor = vec4( min( texColor, vec3( ${CONFIG.WORLD.skyClamp.toFixed(1)} ) ), 1.0 );`);
  u.sunPosition.value.copy(sunDir);
  if (u.cloudCoverage) { u.cloudCoverage.value = 0.34; u.cloudDensity.value = 0.42; u.cloudElevation.value = 0.55; u.cloudScale.value = 0.00022; u.time.value = 37; }
  const skyScene = new THREE.Scene();
  skyScene.add(sky);
  const groundMat = new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(1.25, 1.12, 0.98, THREE.LinearSRGBColorSpace) }); // sunlit ground bounce
  const ground = new THREE.Mesh(new THREE.CircleGeometry(300, 24).rotateX(-Math.PI / 2), groundMat);
  ground.position.y = -3; skyScene.add(ground);

  const envRT = new THREE.WebGLCubeRenderTarget(256, { type: THREE.HalfFloatType });
  const envCam = new THREE.CubeCamera(0.5, 1000, envRT);
  u.showSunDisc.value = 0;
  envCam.update(renderer, skyScene);
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envTex = pmrem.fromCubemap(envRT.texture).texture;
  pmrem.dispose(); envRT.dispose();

  const bgRT = new THREE.WebGLCubeRenderTarget(512, { type: THREE.HalfFloatType });
  const bgCam = new THREE.CubeCamera(0.5, 1000, bgRT);
  u.showSunDisc.value = 1;
  bgCam.update(renderer, skyScene);

  sky.geometry.dispose(); sky.material.dispose(); ground.geometry.dispose(); groundMat.dispose();
  scene.background = bgRT.texture; scene.backgroundIntensity = CONFIG.WORLD.skyIntensity;
  Game.skyRT = bgRT;
  scene.environment = envTex; scene.environmentIntensity = CONFIG.WORLD.envIntensity;
  vmScene.environment = envTex; vmScene.environmentIntensity = CONFIG.WORLD.envIntensity;
}

/** Fit the sun's orthographic shadow frustum tightly around the playable map. */
function fitShadowCamera() {
  const b = CONFIG.WORLD.bounds;
  const cam = sun.shadow.camera;
  sun.target.position.set((b.minX + b.maxX) / 2, 0, (b.minZ + b.maxZ) / 2);
  sun.position.copy(sun.target.position).addScaledVector(sunDir, 120);
  sun.updateMatrixWorld(); sun.target.updateMatrixWorld();
  _m1.lookAt(sun.position, sun.target.position, UP);
  const inv = _m1.clone().setPosition(sun.position).invert();
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const x of [b.minX, b.maxX]) for (const y of [-1, b.maxY]) for (const z of [b.minZ, b.maxZ]) {
    _v1.set(x, y, z).applyMatrix4(inv);
    minX = Math.min(minX, _v1.x); maxX = Math.max(maxX, _v1.x); minY = Math.min(minY, _v1.y); maxY = Math.max(maxY, _v1.y); minZ = Math.min(minZ, _v1.z); maxZ = Math.max(maxZ, _v1.z);
  }
  cam.left = minX; cam.right = maxX; cam.bottom = minY; cam.top = maxY; cam.near = Math.max(0.5, -maxZ - 5); cam.far = -minZ + 5;
  cam.updateProjectionMatrix();
}

/** Renders the viewmodel scene on top of the world into the same buffer, clearing depth only. */
class ViewmodelPass extends Pass {
  constructor(s, c) { super(); this.scene = s; this.camera = c; this.needsSwap = false; }
  render(r, writeBuffer, readBuffer) {
    const ac = r.autoClear; r.autoClear = false;
    r.setRenderTarget(this.renderToScreen ? null : readBuffer);
    r.clearDepth();
    r.render(this.scene, this.camera);
    r.autoClear = ac;
  }
}

const GradeShader = {
  uniforms: {
    tDiffuse: { value: null }, uRes: { value: new THREE.Vector2(1, 1) }, uTime: { value: 0 },
    uVignette: { value: 0.42 }, uSat: { value: 1.06 }, uContrast: { value: 1.05 },
    uDamage: { value: 0 }, uFlash: { value: 0 }, uLift: { value: new THREE.Vector3(0.006, 0.008, 0.012) },
  },
  vertexShader: /* glsl */`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uTime, uVignette, uSat, uContrast, uDamage, uFlash; uniform vec3 uLift;
    varying vec2 vUv;
    void main(){
      vec3 col = texture2D(tDiffuse, vUv).rgb;
      float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
      col = mix(vec3(l), col, uSat);
      col = (col - 0.5) * uContrast + 0.5 + uLift * (1.0 - l);
      vec2 d = vUv - 0.5; d.x *= uRes.x / uRes.y;
      float r = length(d);
      col *= mix(1.0, smoothstep(1.05, 0.28, r), uVignette);
      float edge = smoothstep(0.32, 0.95, r * 1.25);
      col = mix(col, vec3(0.45, 0.0, 0.0), edge * uDamage);
      col = mix(col, vec3(1.0), clamp(uFlash, 0.0, 1.0));
      float n = fract(sin(dot(vUv * uRes + fract(uTime) * 61.0, vec2(12.9898, 78.233))) * 43758.5453);
      col += (n - 0.5) * 0.010;
      gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }`,
};

const Post = {
  composer: null, bloom: null, grade: null, gtao: null, aa: null, w: 1, h: 1, pr: 1,
  preset() { return CONFIG.GFX_PRESETS[Save.settings.preset] || CONFIG.GFX_PRESETS.medium; },
  build() {
    const P = this.preset();
    if (this.composer) {
      for (const p of this.composer.passes) if (p.dispose) p.dispose();
      this.composer.dispose();
    }
    const c = this.composer = new EffectComposer(renderer);
    c.addPass(new RenderPass(scene, camera));
    this.gtao = null;
    if (P.ssao) {
      const g = new GTAOPass(scene, camera, 256, 256);
      g.updateGtaoMaterial({ radius: 0.7, distanceExponent: 1.6, thickness: 1.2, scale: 1.0, samples: 12, distanceFallOff: 1.0, screenSpaceRadius: false });
      g.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 5, rings: 2, samples: 12 });
      g.blendIntensity = 0.9;
      const baseSize = g.setSize.bind(g);
      g.setSize = (w, h) => baseSize(Math.max(1, (w * 0.5) | 0), Math.max(1, (h * 0.5) | 0));
      const baseRender = g.render.bind(g);
      g.render = (...a) => { fxRoot.visible = false; baseRender(...a); fxRoot.visible = true; };
      c.addPass(g); this.gtao = g;
    }
    this.vmPass = new ViewmodelPass(vmScene, vmCamera); c.addPass(this.vmPass);
    this.bloom = null;
    if (P.bloom) { this.bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), P.bloomStrength, CONFIG.POST.bloomRadius, CONFIG.POST.bloomThreshold); c.addPass(this.bloom); }
    c.addPass(new OutputPass());
    this.grade = new ShaderPass(GradeShader); c.addPass(this.grade);
    this.aa = P.aa === 'smaa' ? new SMAAPass() : new FXAAPass();
    c.addPass(this.aa);
    this.resize();
  },
  resize() {
    const P = this.preset();
    const w = innerWidth, h = innerHeight;
    const pr = Math.min(devicePixelRatio || 1, P.maxDpr) * P.resScale;
    this.w = w; this.h = h; this.pr = pr;
    renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    vmCamera.aspect = w / h; vmCamera.updateProjectionMatrix();
    if (this.composer) {
      this.composer.setPixelRatio(pr); this.composer.setSize(w, h);
      this.grade.uniforms.uRes.value.set(w * pr, h * pr);
    }
  },
  render(dt) {
    this.grade.uniforms.uTime.value += dt;
    this.composer.render(dt);
  },
};

function applyGraphicsPreset() {
  const P = Post.preset();
  const wasEnabled = renderer.shadowMap.enabled;
  renderer.shadowMap.enabled = P.shadows;
  sun.castShadow = P.shadows;
  if (sun.shadow.mapSize.x !== P.shadowSize) {
    sun.shadow.mapSize.set(P.shadowSize, P.shadowSize);
    if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  }
  sun.shadow.radius = P.shadowRadius;
  if (wasEnabled !== P.shadows) scene.traverse((o) => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => (m.needsUpdate = true)); });
  const aniso = Math.min(MAX_ANISO, P.anisotropy);
  for (const t of Textures.all) if (t.anisotropy !== aniso && t.userData.aniso) { t.anisotropy = aniso; t.needsUpdate = true; }
  Post.build();
}
addEventListener('resize', () => Post.resize());

/* =====================================================================
   TEXTURES — procedural, tileable PBR sets (albedo + normal + ORM)
   Albedo alpha is a "tint mask": 1 = takes the vertex/material tint (paint),
   0 = keeps its own colour (rust, mortar, bare metal).
   ===================================================================== */
const Noise = (() => {
  const T = new Float32Array(65536);
  { const r = mulberry32(1337); for (let i = 0; i < T.length; i++) T[i] = r(); }
  // periodic value noise; px/py are integer periods (powers of two)
  function vnoise(x, y, px, py, s) {
    const xi = Math.floor(x), yi = Math.floor(y);
    let fx = x - xi, fy = y - yi;
    const mx = px - 1, my = py - 1, ox = s & 255, oy = (s >> 8) & 255;
    const x0 = ((xi & mx) + ox) & 255, x1 = (((xi + 1) & mx) + ox) & 255;
    const y0 = ((((yi & my) + oy) & 255) << 8), y1 = (((((yi + 1) & my) + oy) & 255) << 8);
    const a = T[y0 + x0], b = T[y0 + x1], c = T[y1 + x0], d = T[y1 + x1];
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  }
  function fbm(u, v, fx, fy, oct, s, gain = 0.5) {
    let sum = 0, amp = 1, norm = 0;
    for (let o = 0; o < oct; o++) {
      sum += amp * vnoise(u * fx, v * fy, fx, fy, s + o * 1013);
      norm += amp; amp *= gain; fx *= 2; fy *= 2;
    }
    return sum / norm;
  }
  const W = { f1: 0, f2: 0, id: 0 };
  function worley(u, v, n, s) {
    const x = u * n, y = v * n, xi = Math.floor(x), yi = Math.floor(y);
    let f1 = 9, f2 = 9, id = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const cx = xi + dx, cy = yi + dy;
      const wx = ((cx % n) + n) % n, wy = ((cy % n) + n) % n;
      const idx = (((wy + s) & 255) << 8) | ((wx + (s >> 3)) & 255);
      const fx = cx + T[idx] - x, fy = cy + T[(idx + 31337) & 65535] - y;
      const d = fx * fx + fy * fy;
      if (d < f1) { f2 = f1; f1 = d; id = idx; } else if (d < f2) f2 = d;
    }
    W.f1 = Math.sqrt(f1); W.f2 = Math.sqrt(f2); W.id = T[(id + 4242) & 65535];
    return W;
  }
  const hash = (i) => T[i & 65535];
  return { vnoise, fbm, worley, hash, T };
})();

const Textures = {
  all: [], sets: {}, misc: {},
  dataTex(arr, size, srgb, aniso = true) {
    const t = new THREE.DataTexture(arr, size, size, THREE.RGBAFormat, THREE.UnsignedByteType);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true;
    t.anisotropy = Math.min(MAX_ANISO, Post.preset().anisotropy); t.userData.aniso = aniso;
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    t.needsUpdate = true; this.all.push(t); return t;
  },
  canvasTex(cv, srgb = true) {
    const t = new THREE.CanvasTexture(cv);
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 4; this.all.push(t); return t;
  },
  /** Run a per-pixel recipe and pack albedo / normal / ORM textures. */
  make(name, recipe, normalStrength = 4, size = CONFIG.TEX_SIZE) {
    const S = size, N = S * S;
    const H = new Float32Array(N), alb = new Uint8Array(N * 4), orm = new Uint8Array(N * 4);
    const px = { r: 0.5, g: 0.5, b: 0.5, a: 1, h: 0, rough: 0.8, metal: 0, ao: 1 };
    for (let y = 0; y < S; y++) {
      const v = y / S;
      for (let x = 0; x < S; x++) {
        const u = x / S;
        px.a = 1; px.metal = 0; px.ao = 1;
        recipe(u, v, px);
        const i = y * S + x, j = i * 4;
        H[i] = px.h;
        alb[j] = clamp(px.r, 0, 1) * 255; alb[j + 1] = clamp(px.g, 0, 1) * 255; alb[j + 2] = clamp(px.b, 0, 1) * 255; alb[j + 3] = clamp(px.a, 0, 1) * 255;
        orm[j] = clamp(px.ao, 0, 1) * 255; orm[j + 1] = clamp(px.rough, 0.02, 1) * 255; orm[j + 2] = clamp(px.metal, 0, 1) * 255; orm[j + 3] = 255;
      }
    }
    const nrm = new Uint8Array(N * 4);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const l = H[y * S + ((x - 1 + S) % S)], r = H[y * S + ((x + 1) % S)];
      const d = H[((y - 1 + S) % S) * S + x], up = H[((y + 1) % S) * S + x];
      let nx = (l - r) * normalStrength, ny = (d - up) * normalStrength, nz = 1;
      const il = 1 / Math.sqrt(nx * nx + ny * ny + nz * nz); nx *= il; ny *= il; nz *= il;
      const j = (y * S + x) * 4;
      nrm[j] = (nx * 0.5 + 0.5) * 255; nrm[j + 1] = (ny * 0.5 + 0.5) * 255; nrm[j + 2] = (nz * 0.5 + 0.5) * 255; nrm[j + 3] = 255;
    }
    const set = { map: this.dataTex(alb, S, true), normalMap: this.dataTex(nrm, S, false), ormMap: this.dataTex(orm, S, false) };
    this.sets[name] = set;
    return set;
  },
};

const { vnoise, fbm, worley } = Noise;
const RECIPES = {
  concrete(u, v, p) {
    const n1 = fbm(u, v, 4, 4, 5, 11), n2 = fbm(u, v, 32, 32, 3, 23), n3 = vnoise(u * 256, v * 256, 256, 256, 37);
    const W = worley(u, v, 28, 41);
    const pit = smoothstep(0.17, 0.03, W.f1) * smoothstep(0.42, 0.62, n2);
    const stain = smoothstep(0.52, 0.8, fbm(u, v, 2, 2, 4, 53));
    const e = Math.min(u, 1 - u, v, 1 - v), seam = smoothstep(0.0045, 0.0, e);
    const c = 0.58 + (n1 - 0.5) * 0.22 + (n3 - 0.5) * 0.07 - stain * 0.13 - pit * 0.2 - seam * 0.22;
    p.r = c * 1.02; p.g = c; p.b = c * 0.955;
    p.h = n1 * 0.3 + n2 * 0.35 + n3 * 0.1 - pit * 0.45 - seam * 0.6;
    p.rough = 0.8 + (n2 - 0.5) * 0.22 + stain * 0.06; p.ao = 1 - pit * 0.5 - seam * 0.45;
  },
  asphalt(u, v, p) {
    const n1 = fbm(u, v, 8, 8, 4, 61), g = vnoise(u * 256, v * 256, 256, 256, 67), g2 = vnoise(u * 128, v * 128, 128, 128, 71);
    const W = worley(u, v, 8, 73);
    const crack = smoothstep(0.03, 0.0, W.f2 - W.f1) * smoothstep(0.56, 0.7, fbm(u, v, 4, 4, 3, 79));
    const patch = smoothstep(0.6, 0.66, fbm(u, v, 2, 2, 3, 83));
    const stone = g > 0.8 ? (g - 0.8) * 3.5 : 0;
    const c = 0.17 + (n1 - 0.5) * 0.07 + stone * 0.22 - (g2 < 0.22 ? 0.035 : 0) - crack * 0.09 + patch * 0.035;
    p.r = c; p.g = c; p.b = c * 1.03;
    p.h = g * 0.22 + n1 * 0.2 + stone * 0.4 - crack * 0.8;
    p.rough = 0.9 - stone * 0.25 - patch * 0.12; p.ao = 1 - crack * 0.6;
  },
  brick(u, v, p) {
    const rows = 16, cols = 4;
    const ry = v * rows, row = Math.floor(ry), fy = ry - row;
    const rx = u * cols + ((row & 1) ? 0.5 : 0), col = Math.floor(rx), fx = rx - col;
    const id = Noise.hash(row * 131 + (((col % cols) + cols) % cols) * 977 + 7);
    const id2 = Noise.hash(row * 71 + col * 313 + 99);
    const ey = Math.min(fy, 1 - fy) / rows, ex = Math.min(fx, 1 - fx) / cols, e = Math.min(ey, ex);
    const n = fbm(u, v, 16, 16, 4, 91), fine = vnoise(u * 256, v * 256, 256, 256, 97);
    const mortar = smoothstep(0.0072, 0.0042, e + (n - 0.5) * 0.002);
    const bevel = smoothstep(0.0042, 0.013, e);
    const chip = smoothstep(0.64, 0.72, fbm(u, v, 32, 32, 3, 101)) * (1 - bevel * 0.7);
    const shade = 0.72 + id * 0.42 - (id2 < 0.1 ? 0.25 : 0);
    const br = 0.80 * shade + (n - 0.5) * 0.08, bg = 0.62 * shade + (n - 0.5) * 0.06, bb = 0.52 * shade + (n - 0.5) * 0.05;
    const m = 0.66 + (fine - 0.5) * 0.1;
    p.r = lerp(br, m, mortar); p.g = lerp(bg, m * 0.98, mortar); p.b = lerp(bb, m * 0.94, mortar);
    p.a = 1 - mortar;
    p.h = lerp(0.55 + bevel * 0.3 + (n - 0.5) * 0.14 - chip * 0.3 + fine * 0.04, 0.1 + fine * 0.06, mortar);
    p.rough = lerp(0.8 + (n - 0.5) * 0.12, 0.95, mortar); p.ao = lerp(1 - chip * 0.2, 0.55, mortar);
  },
  plaster(u, v, p) {
    const n1 = fbm(u, v, 4, 4, 5, 111), n2 = fbm(u, v, 32, 32, 3, 113), fine = vnoise(u * 256, v * 256, 256, 256, 115);
    const blotch = smoothstep(0.52, 0.78, fbm(u, v, 2, 2, 4, 117));
    const W = worley(u, v, 6, 118);
    const crack = smoothstep(0.018, 0.0, W.f2 - W.f1) * smoothstep(0.64, 0.72, fbm(u, v, 4, 4, 2, 119));
    const c = 0.84 + (n1 - 0.5) * 0.12 - blotch * 0.12 - crack * 0.35 + (fine - 0.5) * 0.04;
    p.r = c; p.g = c; p.b = c; p.a = 1 - crack * 0.6 - blotch * 0.3;
    p.h = n2 * 0.45 + fine * 0.18 + n1 * 0.2 - crack * 0.6;
    p.rough = 0.9 - blotch * 0.05; p.ao = 1 - crack * 0.5;
  },
  metalCorr(u, v, p) {
    const s = Math.sin(u * 12 * Math.PI * 2);
    const corr = 0.5 + 0.5 * Math.sign(s) * Math.pow(Math.abs(s), 0.55);
    const rustN = fbm(u, v, 4, 8, 5, 131) + (1 - v) * 0.0;
    const rust = smoothstep(0.6, 0.74, rustN + fbm(u, v, 32, 32, 2, 133) * 0.1);
    const streak = fbm(u, v, 64, 2, 3, 137);
    const scratch = smoothstep(0.86, 0.95, vnoise(u * 128, v * 8, 128, 8, 139)) * (1 - rust);
    const fine = vnoise(u * 256, v * 256, 256, 256, 141);
    const paint = 0.78 * (0.86 + streak * 0.22) + (fine - 0.5) * 0.04;
    const rc = 0.6 + fine * 0.5;
    p.r = lerp(lerp(paint, 0.62, scratch), 0.42 * rc, rust);
    p.g = lerp(lerp(paint, 0.62, scratch), 0.22 * rc, rust);
    p.b = lerp(lerp(paint, 0.64, scratch), 0.12 * rc, rust);
    p.a = (1 - rust) * (1 - scratch);
    p.h = corr * 0.9 + rust * fine * 0.1;
    p.rough = lerp(lerp(0.5 + streak * 0.15, 0.35, scratch), 0.88, rust); p.metal = scratch * 0.9;
    p.ao = 0.85 + corr * 0.15;
  },
  metalPlate(u, v, p) {
    const n1 = fbm(u, v, 4, 4, 4, 151), fine = vnoise(u * 256, v * 256, 256, 256, 153), n2 = fbm(u, v, 16, 16, 3, 155);
    const dirt = smoothstep(0.55, 0.8, n1);
    const scratch = smoothstep(0.9, 0.97, vnoise(u * 64, v * 256, 64, 256, 157)) * smoothstep(0.5, 0.6, n2);
    const chip = smoothstep(0.72, 0.78, fbm(u, v, 16, 16, 3, 159));
    const c = 0.8 - dirt * 0.12 + (fine - 0.5) * 0.02;
    p.r = lerp(c, 0.55, Math.max(scratch, chip)); p.g = lerp(c, 0.55, Math.max(scratch, chip)); p.b = lerp(c, 0.57, Math.max(scratch, chip));
    p.a = 1 - Math.max(scratch, chip) - dirt * 0.25;
    p.h = n2 * 0.1 + fine * 0.05 - chip * 0.2;
    p.rough = 0.38 + dirt * 0.25 + (n2 - 0.5) * 0.1; p.metal = Math.max(scratch, chip) * 0.85;
  },
  steel(u, v, p) {
    const brush = fbm(u, v, 2, 128, 3, 161), n = fbm(u, v, 4, 4, 3, 163), fine = vnoise(u * 256, v * 256, 256, 256, 165);
    const c = 0.6 + (brush - 0.5) * 0.12 + (n - 0.5) * 0.08;
    p.r = c; p.g = c; p.b = c * 1.02;
    p.h = brush * 0.3 + fine * 0.05; p.rough = 0.34 + (n - 0.5) * 0.16 + (brush - 0.5) * 0.08; p.metal = 1;
  },
  wood(u, v, p) {
    const planks = 5, pu = u * planks, pi = Math.floor(pu), pf = pu - pi;
    const id = Noise.hash(pi * 97 + 13), id2 = Noise.hash(pi * 41 + 7);
    const seg = Math.floor(v * 2 + id2 * 2), segF = v * 2 + id2 * 2 - seg;
    const butt = smoothstep(0.012, 0.0, Math.min(segF, 1 - segF)) * (id > 0.5 ? 1 : 0);
    const gap = Math.max(smoothstep(0.035, 0.0, Math.min(pf, 1 - pf)), butt);
    const warp = fbm(u, v, 4, 2, 3, 171);
    const grain = vnoise(u * 256 + warp * 12, v * 8, 256, 8, 173 + seg * 3);
    const rings = 0.5 + 0.5 * Math.sin((pf * 2.2 + warp * 3 + id * 9) * Math.PI * 4);
    const n = fbm(u, v, 8, 8, 3, 175);
    const shade = 0.75 + id * 0.4;
    const k = shade * (0.82 + grain * 0.18 + rings * 0.1 + (n - 0.5) * 0.12);
    p.r = 0.62 * k; p.g = 0.47 * k; p.b = 0.31 * k;
    p.h = 0.6 + grain * 0.12 + rings * 0.05 - gap * 0.7;
    p.rough = 0.72 + grain * 0.12; p.ao = 1 - gap * 0.7;
  },
  fabric(u, v, p) {
    const w = Math.sin(u * Math.PI * 2 * 96) * Math.sin(v * Math.PI * 2 * 96);
    const n = fbm(u, v, 4, 4, 4, 181), n2 = fbm(u, v, 16, 16, 3, 183);
    const dirt = smoothstep(0.5, 0.8, n);
    const c = 0.78 + (n2 - 0.5) * 0.12 - dirt * 0.18 + w * 0.03;
    p.r = c; p.g = c; p.b = c; p.a = 1 - dirt * 0.4;
    p.h = 0.5 + w * 0.18 + n2 * 0.25; p.rough = 0.96;
  },
  dirt(u, v, p) {
    const n1 = fbm(u, v, 4, 4, 5, 191), n2 = fbm(u, v, 32, 32, 3, 193), fine = vnoise(u * 256, v * 256, 256, 256, 195);
    const W = worley(u, v, 40, 197);
    const pebble = smoothstep(0.42, 0.22, W.f1) * (W.id > 0.55 ? 1 : 0);
    const c = 0.4 + (n1 - 0.5) * 0.2 + (fine - 0.5) * 0.08 + pebble * (W.id - 0.5) * 0.4;
    p.r = c * 1.08; p.g = c * 0.95; p.b = c * 0.78;
    p.h = n1 * 0.3 + n2 * 0.3 + pebble * 0.5 + fine * 0.1;
    p.rough = 0.95 - pebble * 0.15; p.ao = 1 - (1 - pebble) * 0.1;
  },
  tile(u, v, p) {
    const n = 4, tu = u * n, tv = v * n, iu = Math.floor(tu), iv = Math.floor(tv), fu = tu - iu, fv = tv - iv;
    const id = Noise.hash(iu * 17 + iv * 131 + 3);
    const e = Math.min(fu, 1 - fu, fv, 1 - fv) / n;
    const grout = smoothstep(0.006, 0.003, e);
    const bevel = smoothstep(0.003, 0.012, e);
    const nn = fbm(u, v, 8, 8, 3, 201), fine = vnoise(u * 256, v * 256, 256, 256, 203);
    const chk = (iu + iv) & 1;
    const c = (chk ? 0.74 : 0.62) * (0.92 + id * 0.12) + (nn - 0.5) * 0.06;
    p.r = lerp(c * 1.04, 0.45, grout); p.g = lerp(c * 0.92, 0.43, grout); p.b = lerp(c * 0.8, 0.4, grout);
    p.a = 1 - grout;
    p.h = lerp(0.6 + bevel * 0.2 + fine * 0.03, 0.15, grout);
    p.rough = lerp(0.32 + nn * 0.25, 0.9, grout); p.ao = lerp(1, 0.6, grout);
  },
  polymer(u, v, p) {
    const fine = vnoise(u * 256, v * 256, 256, 256, 211), n = fbm(u, v, 16, 16, 3, 213), st = vnoise(u * 128, v * 128, 128, 128, 215);
    const c = 0.8 + (n - 0.5) * 0.05 + (fine - 0.5) * 0.03;
    p.r = c; p.g = c; p.b = c;
    p.h = fine * 0.25 + st * 0.25 + n * 0.1; p.rough = 0.62 + (n - 0.5) * 0.12;
  },
  camo(u, v, p) {
    const w = Math.sin(u * Math.PI * 2 * 128) * Math.sin(v * Math.PI * 2 * 128);
    const a = fbm(u, v, 4, 4, 4, 221), b = fbm(u, v, 8, 8, 3, 223), c2 = fbm(u, v, 4, 4, 3, 225), d = fbm(u, v, 16, 16, 2, 227);

    if (b > 0.6) { r = 0.33; g = 0.29; bl = 0.21; }
    if (c2 < 0.36) { r = 0.64; g = 0.58; bl = 0.45; }
    if (d > 0.68) { r = 0.27; g = 0.2; bl = 0.14; }
    p.r = r; p.g = g; p.b = bl;
    p.h = 0.5 + w * 0.2 + a * 0.1; p.rough = 0.95;
  },
  glove(u, v, p) {
    const fine = vnoise(u * 256, v * 256, 256, 256, 231), n = fbm(u, v, 16, 16, 3, 233);
    const c = 0.8 + (n - 0.5) * 0.1;
    p.r = c; p.g = c; p.b = c;
    p.h = n * 0.4 + fine * 0.2; p.rough = 0.72 + (n - 0.5) * 0.12;
  },
};

/** Canvas-drawn textures: particles atlas, muzzle flashes, decals, markings, grime, signs. */
function buildCanvasTextures() {
  const mk = (w, h = w) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
  // --- particle atlas 2x2: 0 smoke, 1 glow, 2 star, 3 chunk
  {
    const [c, g] = mk(256);
    // smoke puff
    const id = g.createImageData(128, 128);
    for (let y = 0; y < 128; y++) for (let x = 0; x < 128; x++) {
      const dx = (x - 64) / 64, dy = (y - 64) / 64, r = Math.sqrt(dx * dx + dy * dy);
      const n = fbm(x / 128, y / 128, 4, 4, 4, 301);
      const a = clamp((1 - r) * 1.4, 0, 1) * smoothstep(0.2, 0.75, n + (1 - r) * 0.45);
      const j = (y * 128 + x) * 4; id.data[j] = id.data[j + 1] = id.data[j + 2] = 255; id.data[j + 3] = a * 255;
    }
    g.putImageData(id, 0, 0);
    // glow
    let gr = g.createRadialGradient(192, 64, 0, 192, 64, 62);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,0.75)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(128, 0, 128, 128);
    // star burst
    g.save(); g.translate(64, 192);
    for (let i = 0; i < 7; i++) {
      g.rotate((Math.PI * 2) / 7 + (i % 2) * 0.2);
      const len = 40 + (i * 37 % 20);
      const lg = g.createLinearGradient(0, 0, len, 0); lg.addColorStop(0, 'rgba(255,255,255,1)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = lg; g.beginPath(); g.moveTo(0, -7); g.lineTo(len, 0); g.lineTo(0, 7); g.closePath(); g.fill();
    }
    gr = g.createRadialGradient(0, 0, 0, 0, 0, 30); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 30, 0, Math.PI * 2); g.fill();
    g.restore();
    // chunk
    g.save(); g.translate(192, 192); g.fillStyle = '#fff'; g.beginPath();
    for (let i = 0; i < 9; i++) { const a = (i / 9) * Math.PI * 2, r = 30 + ((i * 53) % 17); g.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    g.closePath(); g.fill(); g.restore();
    const t = Textures.canvasTex(c, false); t.flipY = false; Textures.misc.particles = t;
  }
  // --- viewmodel muzzle flash textures
  {
    const [c, g] = mk(128);
    g.translate(64, 64);
    for (let i = 0; i < 5; i++) {
      g.save(); g.rotate((i / 5) * Math.PI * 2 + 0.3);
      const lg = g.createLinearGradient(0, 0, 60, 0); lg.addColorStop(0, 'rgba(255,240,200,1)'); lg.addColorStop(0.5, 'rgba(255,170,60,0.7)'); lg.addColorStop(1, 'rgba(255,120,30,0)');
      g.fillStyle = lg; g.beginPath(); g.moveTo(0, -10); g.quadraticCurveTo(30, -4, 62, 0); g.quadraticCurveTo(30, 4, 0, 10); g.fill(); g.restore();
    }
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, 34); gr.addColorStop(0, 'rgba(255,255,240,1)'); gr.addColorStop(0.4, 'rgba(255,200,110,0.85)'); gr.addColorStop(1, 'rgba(255,140,40,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 34, 0, Math.PI * 2); g.fill();
    Textures.misc.flashFront = Textures.canvasTex(c);
  }
  {

/** Gloved hand, merged into a single mesh. side: 1 = right, -1 = left. Fingers point -Z, back of hand +Y. */
function buildHand(side, curl, thumbPose) {
  const P = new PartBuilder();
  const M = VMMats;
  P.add(M.glove, RB(0.08, 0.032, 0.09, 0.013), 0, 0, -0.046);
  P.add(M.gloveDark, RB(0.068, 0.009, 0.026, 0.003), 0, 0.017, -0.078);
  P.add(M.glove, new THREE.CylinderGeometry(0.037, 0.039, 0.05, 14).rotateX(Math.PI / 2), 0, 0, 0.012);
  P.add(M.gloveDark, new THREE.CylinderGeometry(0.0395, 0.0395, 0.012, 14).rotateX(Math.PI / 2), 0, 0, 0.03);
  const F = [{ x: -0.027, l: [0.044, 0.027, 0.022], r: 0.0097 }, { x: -0.009, l: [0.047, 0.029, 0.023], r: 0.0101 }, { x: 0.009, l: [0.045, 0.028, 0.022], r: 0.0098 }, { x: 0.026, l: [0.036, 0.022, 0.019], r: 0.0088 }];
  const m = new THREE.Matrix4(), t = new THREE.Matrix4(), seg = new THREE.Matrix4();
  F.forEach((f, i) => {
    m.makeTranslation(f.x * side, -0.002, -0.088);
    m.multiply(t.makeRotationY((i - 1.5) * -0.04 * side));
    for (let j = 0; j < 3; j++) {
      m.multiply(t.makeRotationX(-curl[i][j]));
      const g = RB(f.r * 2, f.r * 1.85, f.l[j] + f.r * 0.9, f.r * 0.85, 1);
      seg.copy(m).multiply(t.makeTranslation(0, 0, -f.l[j] / 2));
      g.applyMatrix4(seg);
      P.add(j === 0 ? M.glove : M.glove, g);
      if (j === 0) { const k = RB(f.r * 2.1, 0.006, f.r * 1.6, 0.0025); k.applyMatrix4(seg.clone().multiply(t.makeTranslation(0, f.r * 0.95, 0))); P.add(M.gloveDark, k); }
      m.multiply(t.makeTranslation(0, 0, -f.l[j]));
    }
  });
  // thumb
  m.makeTranslation(-0.036 * side, -0.01, -0.024);
  m.multiply(t.makeRotationY(thumbPose[0] * side)).multiply(t.makeRotationX(thumbPose[1])).multiply(t.makeRotationZ(-0.4 * side));
  for (const [len, c] of [[0.036, 0], [0.03, thumbPose[2]]]) {
    m.multiply(t.makeRotationX(-c));
    const g = RB(0.022, 0.02, len + 0.01, 0.009, 1);
    g.applyMatrix4(seg.copy(m).multiply(t.makeTranslation(0, 0, -len / 2)));
    P.add(M.glove, g);
    m.multiply(t.makeTranslation(0, 0, -len));
  }
  const grp = new THREE.Group();
  P.build(grp);
  return grp;
}

const Viewmodel = {
  root: null, pivot: null, gun: null, model: null, rHand: null, lHand: null, arms: [], flash: null,
  flashT: 0, adsPos: new THREE.Vector3(), def: null,
  kickPos: [new Spring(), new Spring(), new Spring()], kickRot: [new Spring(), new Spring(), new Spring()],
  sway: [new Spring(), new Spring()], land: new Spring(160, 13),
  shells: null, shellData: [], shellNext: 0, breathe: 0,
  _p: new THREE.Vector3(), _r: new THREE.Vector3(),
  build(def) {
    const C = CONFIG.VIEWMODEL;
    for (const s of this.kickPos) { s.k = C.kickStiff; s.d = C.kickDamp; }
    for (const s of this.kickRot) { s.k = C.rotStiff; s.d = C.rotDamp; }
    for (const s of this.sway) { s.k = C.swayStiff; s.d = C.swayDamp; }
    this.def = def;
    this.root = new THREE.Group(); vmScene.add(this.root);
    this.pivot = new THREE.Group(); this.root.add(this.pivot);
    const model = this.model = buildRifleModel();
    this.gun = model.root; this.pivot.add(this.gun);
    // hands
    this.rHand = buildHand(1, [[0.55, 0.85, 0.5], [1.25, 1.45, 0.95], [1.3, 1.45, 0.95], [1.3, 1.4, 0.9]], [0.75, -0.25, 0.45]);
    this.lHand = buildHand(-1, [[0.9, 0.85, 0.55], [0.95, 0.9, 0.55], [1.0, 0.9, 0.55], [1.0, 0.85, 0.5]], [1.25, 0.2, 0.15]);
    this.gun.add(this.rHand, this.lHand);
    const setPose = (obj, p) => { const q = this.poseFrom(p); obj.position.copy(q.pos); obj.quaternion.copy(q.q); };
    setPose(this.rHand, model.rightHand); setPose(this.lHand, model.leftHand);
    this.poseL = { hg: this.poseFrom(model.leftHand), mag: this.poseFrom(model.magGrip), bolt: this.poseFrom(model.boltCatch) };
    // sleeves (in vm space, re-aimed at the wrists every frame)
    const sleeveGeo = new THREE.CylinderGeometry(0.038, 0.049, 0.32, 16, 1, true).translate(0, -0.16, 0);
    const cuffGeo = new THREE.CylinderGeometry(0.044, 0.044, 0.05, 16, 1, true).translate(0, -0.035, 0);
    for (const side of [1, -1]) {
      const s = new THREE.Mesh(sleeveGeo, VMMats.sleeve); s.frustumCulled = false;
      const c = new THREE.Mesh(cuffGeo, VMMats.sleeve); c.frustumCulled = false; s.add(c);
      this.root.add(s); this.arms.push({ mesh: s, side, hand: side > 0 ? this.rHand : this.lHand, elbow: side > 0 ? new THREE.Vector3(0.24, -0.5, 0.1) : new THREE.Vector3(-0.2, -0.62, -0.16) });
    }
    // muzzle flash
    const fl = this.flash = new THREE.Group();
    const front = new THREE.Mesh(new THREE.PlaneGeometry(0.19, 0.19), VMMats.flashFront); front.frustumCulled = false;
    const side1 = new THREE.Mesh(new THREE.PlaneGeometry(0.09, 0.32).rotateX(-Math.PI / 2).translate(0, 0, -0.15), VMMats.flashSide); side1.frustumCulled = false;
    const side2 = side1.clone(); side2.rotation.z = Math.PI / 2;
    fl.add(front, side1, side2); fl.userData.front = front;
    model.muzzle.add(fl); fl.visible = false;
    // shell casings
    const sg = new THREE.CylinderGeometry(0.0046, 0.0046, 0.03, 8).rotateZ(Math.PI / 2);
    this.shells = new THREE.InstancedMesh(sg, VMMats.brass, CONFIG.FX.shellPool);
    this.shells.frustumCulled = false; this.shells.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    for (let i = 0; i < CONFIG.FX.shellPool; i++) { this.shellData.push({ t: 0, p: new THREE.Vector3(), v: new THREE.Vector3(), q: new THREE.Quaternion(), w: new THREE.Vector3() }); this.shells.setMatrixAt(i, _m1.makeScale(0, 0, 0)); }
    this.root.add(this.shells);
    // ADS pose: sight centre on the view axis
    this.adsPos.copy(model.sight).negate().add(_v1.set(0, 0, -CONFIG.VIEWMODEL.adsSightDist));
  },
  /** Hand orientation from a basis: local +Y = back of hand, local -Z = fingers. */
  poseFrom(p) {
    const Y = new THREE.Vector3().fromArray(p.back).normalize();
    const F = new THREE.Vector3().fromArray(p.finger);
    F.addScaledVector(Y, -F.dot(Y)).normalize();
    const Z = F.clone().negate(), X = new THREE.Vector3().crossVectors(Y, Z).normalize();
    return { pos: new THREE.Vector3().fromArray(p.pos), q: new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(X, Y, Z)) };
  },
  reset() {
    for (const s of [...this.kickPos, ...this.kickRot, ...this.sway, this.land]) s.reset();
    this.flash.visible = false; this.flashT = 0;
    for (const d of this.shellData) d.t = 0;
  },
  kick(rec, adsT) {
    const k = lerp(1, rec.adsVmMult, adsT);
    this.kickPos[2].v += rec.vmBack * 60 * k;
    this.kickPos[1].v += rec.vmUp * 60 * k;
    this.kickPos[0].v += (Math.random() - 0.5) * rec.vmBack * 18 * k;
    this.kickRot[0].v += rec.vmPitch * 60 * k * rand(0.8, 1.15);
    this.kickRot[1].v += (Math.random() - 0.5) * rec.vmYaw * 120 * k;
    this.kickRot[2].v += (Math.random() - 0.5) * rec.vmRoll * 120 * k;
  },
  fire(adsT) {
    this.flashT = CONFIG.FX.muzzleFlashTime;
    const fl = this.flash; fl.visible = true;
    const sc = lerp(1, 0.55, adsT) * rand(0.8, 1.2);
    fl.scale.setScalar(sc); fl.userData.front.rotation.z = Math.random() * Math.PI * 2;
    fl.rotation.z = Math.random() * Math.PI;
    vmMuzzleLight.intensity = 2.5;
    this.model.muzzle.getWorldPosition(vmMuzzleLight.position);
    // eject a casing
    const d = this.shellData[this.shellNext]; this.shellNext = (this.shellNext + 1) % this.shellData.length;
    this.model.eject.getWorldPosition(d.p);
    d.v.set(rand(1.1, 1.7), rand(0.7, 1.2), rand(0.1, 0.5)); d.t = 0.55;
    d.q.setFromEuler(_e1.set(rand(0, 6), rand(0, 6), 0)); d.w.set(rand(-25, 25), rand(-25, 25), rand(-25, 25));
  },
  /** Called once per frame with the gameplay state. */
  update(dt, s) {
    const C = CONFIG.VIEWMODEL;
    const ads = smoother(clamp(s.adsT, 0, 1));
    const sprint = smoother(clamp(s.sprintT, 0, 1)) * (1 - ads);
    const p = this._p, r = this._r;
    // base pose blend
    p.fromArray(C.hipPos).lerp(this.adsPos, ads);
    r.fromArray(C.hipRot).multiplyScalar(1 - ads);
    p.lerp(_v1.fromArray(C.sprintPos), sprint); r.lerp(_v1.fromArray(C.sprintRot), sprint);
    const cr = s.crouchT * (1 - ads) * (1 - sprint);
    p.x += C.crouchOffset[0] * cr; p.y += C.crouchOffset[1] * cr; p.z += C.crouchOffset[2] * cr; r.z += C.crouchRoll * cr;
    if (s.slide) { r.z += -0.18 * (1 - ads); p.x -= 0.015 * (1 - ads); }
    // reload choreography
    const rl = s.reload;
    let magW = 0;
    if (rl) {
      const R = Reload.sample(rl.t / rl.dur, rl.empty);
      p.x += R.pos[0] * (1 - ads * 0.5); p.y += R.pos[1]; p.z += R.pos[2];
      r.x += R.rot[0]; r.y += R.rot[1]; r.z += R.rot[2];
      this.model.mag.position.set(R.mag[0], -0.098 + R.mag[1], -0.062 + R.mag[2]);
      this.model.mag.rotation.set(R.mag[3], 0, R.mag[4]);
      this.model.charge.position.z = 0.095 + R.charge * 0.075;
      magW = R.hand; this.lHandBolt = R.bolt;
    } else {
      this.model.mag.position.set(0, -0.098, -0.062); this.model.mag.rotation.set(0, 0, 0); this.model.charge.position.z = 0.095; this.lHandBolt = 0;
    }
    this.model.mag.visible = !s.magHidden;
    // left hand: handguard <-> magazine <-> bolt catch
    const L = this.poseL, lh = this.lHand;
    if (magW > 0 || this.lHandBolt > 0) {
      _v2.copy(this.model.mag.position).add(L.mag.pos).sub(_v3.set(0, -0.098, -0.062));
      lh.position.copy(L.hg.pos).lerp(_v2, magW);
      lh.quaternion.copy(L.hg.q).slerp(L.mag.q, magW);
      if (this.lHandBolt > 0) { lh.position.lerp(L.bolt.pos, this.lHandBolt); lh.quaternion.slerp(L.bolt.q, this.lHandBolt); }
    } else { lh.position.copy(L.hg.pos); lh.quaternion.copy(L.hg.q); }
    // movement bob (figure-eight), damped heavily when aiming
    const bobK = s.bobAmt * lerp(1, C.bobAdsMult, ads) * (s.sprinting ? C.bobSprintMult : 1) * Save.settings.headBob;
    const ph = s.bobPhase;
    p.x += Math.sin(ph) * C.bobPosX * bobK;
    p.y += -Math.abs(Math.cos(ph)) * C.bobPosY * bobK + C.bobPosY * 0.5 * bobK;
    r.z += Math.sin(ph) * C.bobRot * bobK; r.y += Math.sin(ph) * C.bobRot * 0.5 * bobK;
    if (s.sprinting) { r.x += Math.sin(ph * 2) * 0.03 * sprint; p.y += Math.sin(ph * 2) * 0.006 * sprint; }
    // idle breathing
    this.breathe += dt;
    const br = C.breathe * lerp(1, 0.35, ads);
    p.y += Math.sin(this.breathe * 1.6) * br; r.x += Math.sin(this.breathe * 1.6 + 0.6) * br * 2.2; r.y += Math.sin(this.breathe * 0.9) * br * 1.5;
    // look sway (lag behind the camera)
    const swayMul = lerp(1, C.swayAdsMult, ads);
    const tx = clamp(-s.lookDX * C.swayLook, -C.swayMax, C.swayMax) * swayMul;
    const ty = clamp(-s.lookDY * C.swayLook, -C.swayMax, C.swayMax) * swayMul;
    const sx = this.sway[0].update(dt, tx), sy = this.sway[1].update(dt, ty);
    r.y += sx; r.x += sy; p.x += sx * 0.06; p.y -= sy * 0.03; r.z += sx * 0.6;
    // strafe roll, jump/land
    r.z += -s.strafe * C.strafeRoll * (1 - ads * 0.8);
    const land = this.land.update(dt, 0);
    p.y += land * lerp(1, 0.3, ads);
    // recoil springs
    const kp = this.kickPos, kr = this.kickRot;
    p.x += kp[0].update(dt); p.y += kp[1].update(dt); p.z += kp[2].update(dt);
    r.x += kr[0].update(dt); r.y += kr[1].update(dt); r.z += kr[2].update(dt);
    this.pivot.position.copy(p);
    this.pivot.rotation.set(r.x, r.y, r.z, 'YXZ');
    // viewmodel FOV narrows when aiming
    const fov = lerp(CONFIG.CAMERA.vmFov, s.vmAdsFov, ads);
    if (Math.abs(vmCamera.fov - fov) > 0.01) { vmCamera.fov = fov; vmCamera.updateProjectionMatrix(); }
    // flash
    if (this.flashT > 0) { this.flashT -= dt; if (this.flashT <= 0) this.flash.visible = false; }
    vmMuzzleLight.intensity = Math.max(0, vmMuzzleLight.intensity - dt * 60);
    // sleeves aim from a fixed elbow anchor to each wrist
    this.root.updateMatrixWorld(true);
    for (const a of this.arms) {
      a.hand.getWorldPosition(_v1); _v1.addScaledVector(_v3.set(0, 0, 0.028).applyQuaternion(a.hand.getWorldQuaternion(_q2)), 1);
      _v2.copy(a.elbow).add(p).sub(_v4.fromArray(C.hipPos)).sub(_v1).normalize();
      a.mesh.position.copy(_v1);
      a.mesh.quaternion.setFromUnitVectors(_v3.set(0, -1, 0), _v2);
    }
    // shells (simple ballistic in camera space)
    for (let i = 0; i < this.shellData.length; i++) {
      const d = this.shellData[i];
      if (d.t <= 0) { this.shells.setMatrixAt(i, _m1.makeScale(0, 0, 0)); continue; }
      d.t -= dt; d.v.y -= 9.8 * dt; d.p.addScaledVector(d.v, dt);
      _q1.setFromEuler(_e1.set(d.w.x * dt, d.w.y * dt, d.w.z * dt)); d.q.multiply(_q1);
      this.shells.setMatrixAt(i, _m1.compose(d.p, d.q, _v1.set(1, 1, 1)));
    }
    this.shells.instanceMatrix.needsUpdate = true;
  },
};

/** Keyframed reload choreography. Tracks are sampled with smooth interpolation. */
const Reload = {
  // [t, gunPos xyz, gunRot xyz]
  tac: {

// --- ray tests (allocation-free) ---
function raySphere(o, d, c, r) {
  const ox = o.x - c.x, oy = o.y - c.y, oz = o.z - c.z;
  const b = ox * d.x + oy * d.y + oz * d.z, cc = ox * ox + oy * oy + oz * oz - r * r;
  const h = b * b - cc; if (h < 0) return -1;
  const t = -b - Math.sqrt(h); return t >= 0 ? t : (cc < 0 ? 0 : -1);
}
function rayCapsule(o, d, a, b, r) {
  const bax = b.x - a.x, bay = b.y - a.y, baz = b.z - a.z, oax = o.x - a.x, oay = o.y - a.y, oaz = o.z - a.z;
  const baba = bax * bax + bay * bay + baz * baz, bard = bax * d.x + bay * d.y + baz * d.z, baoa = bax * oax + bay * oay + baz * oaz;
  const rdoa = d.x * oax + d.y * oay + d.z * oaz, oaoa = oax * oax + oay * oay + oaz * oaz;
  const A = baba - bard * bard, B = baba * rdoa - baoa * bard, C = baba * oaoa - baoa * baoa - r * r * baba;
  let h = B * B - A * C;
  if (A > 1e-8 && h >= 0) {
    const t = (-B - Math.sqrt(h)) / A, y = baoa + t * bard;
    if (y > 0 && y < baba && t >= 0) return t;
  }
  const t1 = raySphere(o, d, a, r), t2 = raySphere(o, d, b, r);
  if (t1 < 0) return t2; if (t2 < 0) return t1; return Math.min(t1, t2);
}

let _actorId = 1;
class SoldierActor {
  constructor(style = 'B', o = {}) {

    BONES.forEach(([, parent], i) => { if (parent >= 0) this.bones[parent].add(this.bones[i]); });

    this.center = new THREE.Vector3();

    this.hitboxes = [hb('head', 'sphere', 0.135), hb('torso', 'capsule', 0.2), hb('torso', 'capsule', 0.17),
      hb('limb', 'capsule', 0.07), hb('limb', 'capsule', 0.06), hb('limb', 'capsule', 0.07), hb('limb', 'capsule', 0.06),
      hb('limb', 'capsule', 0.09), hb('limb', 'capsule', 0.075), hb('limb', 'capsule', 0.09), hb('limb', 'capsule', 0.075)];
    this.poseAim();
  }
  poseAim() {

    B.upperArmR.rotation.set(-1.25, 0, -0.25); B.forearmR.rotation.set(-0.6, 0, 0.1);
    B.upperArmL.rotation.set(-1.45, 0, -0.55); B.forearmL.rotation.set(-0.15, 0, -0.1);
    B.thighL.rotation.set(-0.08, 0, 0.04); B.thighR.rotation.set(0.12, 0, -0.04); B.shinR.rotation.set(0.1, 0, 0);

    this._bp('chest', H[2].a, 0, 0.05, 0.02); this._bp('chest', H[2].b, 0, 0.18, 0.02);
    this._bp('upperArmL', H[3].a); this._bp('forearmL', H[3].b); this._bp('forearmL', H[4].a); this._bp('handL', H[4].b);
    this._bp('upperArmR', H[5].a); this._bp('forearmR', H[5].b); this._bp('forearmR', H[6].a); this._bp('handR', H[6].b);
    this._bp('thighL', H[7].a); this._bp('shinL', H[7].b); this._bp('shinL', H[8].a); this._bp('footL', H[8].b);

const Actors = {
  list: [],
  add(a) { this.list.push(a); },
  remove(a) { const i = this.list.indexOf(a); if (i >= 0) this.list.splice(i, 1); },
  _hit: { part: null, dist: 0 },
  /** Closest actor hit along the ray (excluding `ignoreId`). */
  raycast(o, d, maxDist, ignoreId, res) {
    let best = maxDist, hitActor = null, part = null;
    for (const a of this.list) {
      if (a.id === ignoreId) continue;
      const t = a.raycast(o, d, best, this._hit);
      if (t >= 0 && t < best) { best = t; hitActor = a; part = this._hit.part; }
    }
    if (!hitActor) return null;
    res.actor = hitActor; res.part = part; res.dist = best; res.point.copy(d).multiplyScalar(best).add(o);
    return res;
  },

/** Firing-range pop-up targets: fall when killed, rise again after a delay. */
const Range = {
  targets: [], time: 0,
  init() {
    const st = MapInfo.playerStart;
    for (const def of MapInfo.rangeTargets) {
      const a = new SoldierActor('B', { name: 'TARGET' });
      const y = def.y || 0;
      a.root.position.set(def.x, y, def.z);
      a.root.rotation.y = def.yaw ?? Math.atan2(st.x - def.x, st.z - def.z);
      scene.add(a.root);
      a.updateHitboxes();
      Actors.add(a);
      this.targets.push({ a, def, state: 'up', t: 0, base: new THREE.Vector3(def.x, y, def.z), flinch: new Spring(220, 12), phase: Math.random() * 6 });
    }
  },
  reset() {
    for (const T of this.targets) { T.state = 'up'; T.t = 0; T.a.hp = 100; T.a.alive = true; T.a.root.rotation.x = 0; T.a.root.position.copy(T.base); T.a.updateHitboxes(); }
  },
  setVisible(v) { for (const T of this.targets) T.a.root.visible = v; },
  update(dt) {
    this.time += dt;
    for (const T of this.targets) {
      const a = T.a;
      let moved = false;
      if (T.def.moving && T.state === 'up') {
        const m = T.def.moving;
        const off = Math.sin(this.time * m.speed / m.range + T.phase) * m.range;
        a.root.position.copy(T.base); a.root.position[m.axis] += off; moved = true;
      }
      const fl = T.flinch.update(dt, 0);
      if (Math.abs(fl) > 1e-4 || Math.abs(T.flinch.v) > 1e-3) { a.B.spine.rotation.x = 0.05 - fl; moved = true; }
      if (T.state === 'falling') {
        T.t += dt; const k = Math.min(1, T.t / 0.38); a.root.rotation.x = -(k * k) * Math.PI / 2;
        if (k >= 1) { T.state = 'down'; T.t = 0; AudioSys.play('thud', { pos: a.root.position, vol: 0.6 }); }
      } else if (T.state === 'down') {
        T.t += dt; if (T.t > CONFIG.RANGE.targetRespawn) { T.state = 'rising'; T.t = 0; }
      } else if (T.state === 'rising') {
        T.t += dt; const k = Math.min(1, T.t / 0.45); a.root.rotation.x = -(1 - smoother(k)) * Math.PI / 2;
        if (k >= 1) { T.state = 'up'; a.hp = 100; a.alive = true; a.root.rotation.x = 0; moved = true; }
      }
      if (moved) a.updateHitboxes();
    }
  },
  onHit(actor, dmg, part) {
    const T = this.targets.find((t) => t.a === actor); if (!T) return false;
    actor.hp -= dmg;
    T.flinch.v += part === 'head' ? 9 : 5;
    if (actor.hp <= 0 && actor.alive) { actor.alive = false; T.state = 'falling'; T.t = 0; return true; }
    return false;
  },
};

/* =====================================================================
   WEAPONS — local player's weapon: fire control, spread, recoil
   pattern + recovery, ADS, sprint-to-fire, reloads, hitscan
   ===================================================================== */
function damageAt(def, dist) { let d = def.damage[0][1]; for (const [r, v] of def.damage) if (dist >= r) d = v; return d; }

const Hitscan = {
  res: { actor: null, part: null, dist: 0, point: new THREE.Vector3(), normal: new THREE.Vector3(), surf: 0, flags: 0, world: false },
  /** Trace a bullet: nearest of world geometry and actor hitboxes. */
  trace(o, d, range, ignoreId) {

    r.actor = null; r.world = false;

    if (w) { r.world = true; r.dist = w.dist; r.point.copy(w.point); r.normal.copy(w.normal); r.surf = w.surf; r.flags = w.flags; return r; }

  update(dt, pl, intent) {

  updateReload(dt, inf) {

  computeMuzzleWorld(out) {

    _v1.project(vmCamera);

  fire(pl) {

        const killed = Range.onHit(h.actor, dmg, h.part);
        hitAny = true; killAny = killAny || killed; headAny = headAny || h.part === 'head';
        _v1.copy(_v4).negate();
        FX.impact(h.point, _v1, SURF.FLESH, _v4, 1);
        AudioSys.play('imp_flesh', { pos: h.point, vol: 0.5, ref: 3 });
        if (Save.settings.dmgNumbers && Game.mode === 'range') HUD.damageNumber(h.point, dmg, h.part === 'head', killed);
        Game.rangeStats.hits++; if (h.part === 'head') Game.rangeStats.heads++; if (killed) Game.rangeStats.kills++;
      } else if (h.world) {
        FX.impact(h.point, h.normal, h.surf, _v4, 1);
        if (h.flags & CF.DECAL) FX.decal(h.point, h.normal, h.surf);

      }

    }
    if (hitAny) { HUD.hitmarker(killAny, headAny); AudioSys.play(killAny ? 'kill' : headAny ? 'hithead' : 'hit', { bus: 'ui', vol: killAny ? 0.8 : 0.6, rateVar: 0.01, send: 0 }); }

    const idx = this.shotIndex < R.pattern.length ? this.shotIndex : R.loopFrom + ((this.shotIndex - R.pattern.length) % (R.pattern.length - R.loopFrom));

    Viewmodel.kick(R, ads); Viewmodel.fire(ads);

    AudioSys.play('shell', { vol: 0.16, delay: rand(0.4, 0.62), send: 0.05 });
    FXLights.flash(muzzle, 0xffb066, CONFIG.FX.muzzleLight * def.flash.light, CONFIG.FX.muzzleLightRange, 0.05);
    if (ads < 0.3 && Math.random() < 0.35) FX.muzzleSmoke(muzzle, dir);
  },
};
