const HUD = {
  el: {}, hmT: 0, hmKill: false, msg: null, nums: [], cache: {},
  init() {
    for (const id of ['hud', 'crosshair', 'hitmarker', 'wName', 'wMode', 'wMag', 'wRes', 'wPips', 'centerMsg', 'fps', 'dmgLayer', 'rangeInfo', 'rangeStats', 'clickToPlay']) this.el[id] = $(id);
    const ch = this.el.crosshair;
    this.ch = { t: ch.querySelector('.ct'), b: ch.querySelector('.cb'), l: ch.querySelector('.cl'), r: ch.querySelector('.cr') };
    for (let i = 0; i < 14; i++) { const d = document.createElement('div'); d.className = 'dmgnum'; d.style.display = 'none'; this.el.dmgLayer.appendChild(d); this.nums.push({ el: d, t: 0, pos: new THREE.Vector3(), life: 0.9 }); }
  },
  show() { this.el.hud.classList.remove('hidden'); },
  hide() { this.el.hud.classList.add('hidden'); },
  setWeapon(def) {
    this.el.wName.textContent = def.name;
    this.el.wMode.textContent = def.fireMode.toUpperCase() + ' · ' + def.typeLabel;
    this.el.wPips.innerHTML = '';
    this.pips = [];
    if (def.mag <= 40) for (let i = 0; i < def.mag; i++) { const b = document.createElement('b'); this.el.wPips.appendChild(b); this.pips.push(b); }
    this.cache = {};
  },
  setAmmo(mag, res, size, inf) {
    if (this.cache.mag !== mag) {
      this.cache.mag = mag; this.el.wMag.textContent = mag;
      this.el.wMag.classList.toggle('low', mag <= size * 0.25);
      if (this.pips) this.pips.forEach((p, i) => p.classList.toggle('e', i >= mag));
    }
    const r = inf ? '/ ∞' : '/ ' + res;
    if (this.cache.res !== r) { this.cache.res = r; this.el.wRes.textContent = r; }
  },
  crosshair(gapPx, visible) {
    const v = visible ? '1' : '0';
    if (this.cache.chv !== v) { this.cache.chv = v; this.el.crosshair.style.opacity = v; }
    const g = Math.round(gapPx);
    if (this.cache.gap === g) return;
    this.cache.gap = g;
    this.ch.t.style.transform = `translateY(${-g - 9}px)`; this.ch.b.style.transform = `translateY(${g}px)`;
    this.ch.l.style.transform = `translateX(${-g - 9}px)`; this.ch.r.style.transform = `translateX(${g}px)`;
  },
  hitmarker(kill, head) {
    this.hmT = kill ? 0.32 : 0.2; this.hmKill = kill;
    this.el.hitmarker.classList.toggle('kill', kill);
    this.hmScale = head || kill ? 1.35 : 1.0;
  },
  damageNumber(pos, dmg, head, kill) {
    const n = this.nums.find((x) => x.t <= 0) || this.nums[0];
    n.t = n.life; n.pos.copy(pos); n.pos.y += 0.15;
    n.el.textContent = dmg; n.el.className = 'dmgnum' + (kill ? ' kill' : head ? ' head' : '');
    n.el.style.display = 'block';
  },
  centerMsg(text, warn = false) {
    if (this.msg === text) return;
    this.msg = text;
    const e = this.el.centerMsg; e.textContent = text; e.style.opacity = text ? '1' : '0'; e.classList.toggle('warn', warn);
  },
  update(dt) {
    if (this.hmT > 0) {
      this.hmT -= dt;
      const k = Math.max(0, this.hmT) / (this.hmKill ? 0.32 : 0.2);
      this.el.hitmarker.style.opacity = Math.min(1, k * 1.6).toFixed(2);
      this.el.hitmarker.style.transform = `scale(${(this.hmScale + (1 - k) * 0.25).toFixed(3)})`;
    } else if (this.el.hitmarker.style.opacity !== '0') this.el.hitmarker.style.opacity = '0';
    const w = innerWidth, h = innerHeight;
    for (const n of this.nums) {
      if (n.t <= 0) continue;
      n.t -= dt;
      if (n.t <= 0) { n.el.style.display = 'none'; continue; }
      n.pos.y += dt * 0.5;
      _v1.copy(n.pos).project(camera);
      if (_v1.z > 1) { n.el.style.display = 'none'; continue; }
      n.el.style.display = 'block';
      n.el.style.transform = `translate(${((_v1.x * 0.5 + 0.5) * w).toFixed(1)}px, ${((-_v1.y * 0.5 + 0.5) * h).toFixed(1)}px)`;
      n.el.style.opacity = Math.min(1, n.t / n.life * 2.5).toFixed(2);
    }
  },
};

  fpsAcc: 0, fpsFrames: 0, fpsText: '',
  async boot() {
    const bar = $('loadBar'), status = $('loadStatus');
    const set = (p, s) => { bar.style.width = (p * 100).toFixed(1) + '%'; if (s) status.textContent = s; };
    this._t0 = performance.now();
    try {
      set(0.02, 'Synthesising audio');
      let audioP = 0;
      const audioPromise = AudioSys.prebuild((p) => { audioP = p; });
      const NS = { concrete: 3, asphalt: 3, brick: 5, plaster: 2.5, metalCorr: 6, metalPlate: 2, steel: 1.5, wood: 4, fabric: 4, dirt: 4, tile: 3, polymer: 2, camo: 3, glove: 3 };
      const names = Object.keys(RECIPES);
      for (let i = 0; i < names.length; i++) {
        set(0.04 + 0.5 * (i / names.length), 'Generating textures: ' + names[i]);
        await nextFrame();
        Textures.make(names[i], RECIPES[names[i]], NS[names[i]] ?? 3);
      }
      this.bootTimes = { textures: performance.now() - this._t0 };
      buildCanvasTextures(); buildMaterials(); buildVMMaterials();
      set(0.58, 'Lighting the sky'); await nextFrame();
      buildSkyAndEnvironment();
      set(0.64, 'Building ' + MapInfo.name); await nextFrame();
      const world = new THREE.Group(); world.name = 'world';
      const meshes = buildMap(world); scene.add(world);
      fitShadowCamera();
      this.worldStats = { meshes: meshes.length, collisionTris: Collision.count };
      set(0.74, 'Arming'); await nextFrame();
      FX.init(); HUD.init(); UI.init(); Input.init();
      Viewmodel.build(WEAPONS.kestrel);
      Range.init();
      this.player = new PlayerController();
      applyGraphicsPreset();
      applyAllSettings();
      set(0.82, 'Compiling shaders'); await nextFrame();
      camera.position.set(0, 3, -25); camera.lookAt(0, 2, 0); camera.updateMatrixWorld();
      Viewmodel.flash.visible = true; // compile everything that is normally hidden
      if (renderer.compileAsync && renderer.extensions.has('KHR_parallel_shader_compile')) { await renderer.compileAsync(scene, camera); await renderer.compileAsync(vmScene, vmCamera); }
      else { renderer.compile(scene, camera); renderer.compile(vmScene, vmCamera); }
      Viewmodel.flash.visible = false;
      Post.render(0.016);
      set(0.92, 'Finishing audio');
      while (audioP < 1) { await nextFrame(); set(0.92 + audioP * 0.08); }
      await audioPromise;
      this.bootTimes.total = performance.now() - this._t0;
      set(1, 'Ready');
      $('loading').classList.add('hidden');
      this.toMenu();
      this.last = performance.now();
      requestAnimationFrame((t) => this.loop(t));
    } catch (err) {
      console.error(err);
      const e = $('loadErr'); e.classList.remove('hidden'); e.textContent = 'Failed to start: ' + (err && err.message ? err.message : err);
    }
  },
  toMenu() {
    this.state = 'menu';
    $('menu').classList.remove('hidden'); $('pause').classList.add('hidden'); HUD.hide();
    Viewmodel.root.visible = false;
    Range.reset();
  },
  startRange() {
    AudioSys.unlock();
    this.mode = 'range';
    $('menu').classList.add('hidden'); $('pause').classList.add('hidden');
    const sp = MapInfo.playerStart;
    this.player.spawn(sp.x, 0.2, sp.z, sp.yaw);
    PlayerWeapon.equip(WEAPONS.kestrel);
    Viewmodel.reset(); Viewmodel.root.visible = true;
    FX.clear(); Range.reset();
    this.rangeStats = { shots: 0, hits: 0, heads: 0, kills: 0 };
    HUD.show(); HUD.el.rangeInfo.style.opacity = '1';
    clearTimeout(this._infoT); this._infoT = setTimeout(() => (HUD.el.rangeInfo.style.opacity = '0'), 9000);
    this.state = 'playing';
    AudioSys.startAmbience();
    if (!this.debugNoLock) Input.lock();
  },
  pause() {
    if (this.state !== 'playing') return;
    this.state = 'paused';
    $('pause').classList.remove('hidden');
    Input.down.clear(); Input.mouseDown.fill(false);
  },
  resume() {
    if (this.state !== 'paused') return;
    $('pause').classList.add('hidden'); $('settings').classList.add('hidden');
    this.state = 'playing';
    if (!this.debugNoLock) Input.lock();
  },
  quitToMenu() {
    const st = Save.data.stats; st.shots += this.rangeStats.shots; st.hits += this.rangeStats.hits; st.headshots += this.rangeStats.heads; Save.save();
    $('settings').classList.add('hidden');
    AudioSys.stopAmbience();
    Input.unlock();
    this.toMenu();
  },
  onPointerLock(locked, was) {
    if (!locked && was && this.state === 'playing') this.pause();
  },
  loop(now) {
    requestAnimationFrame((t) => this.loop(t));
    let dt = (now - this.last) / 1000; this.last = now;
    if (!(dt > 0)) dt = 0.001; if (dt > 0.1) dt = 0.1;
    renderer.info.reset();
    this.update(dt);
    Post.render(dt);
    Input.endFrame();
    this.updateFps(dt);
  },
  update(dt) {
    this.frameNo++;
    if (this.state === 'playing') {
      this.time += dt;
      this.updatePlaying(dt);
    } else if (this.state === 'menu') {
      this.time += dt;
      this.updateMenuCamera(dt);
      Range.update(dt); FX.update(dt); FXLights.update(dt);
    }
    const showClick = this.state === 'playing' && !Input.locked && !this.debugNoLock;
    HUD.el.clickToPlay.classList.toggle('hidden', !showClick);
  },
  updatePlaying(dt) {
    const pl = this.player, w = PlayerWeapon, def = w.def, S = Save.settings;
    // --- look (raw mouse, scaled for ADS zoom so aim feels consistent)
    const [dx, dy] = Input.consumeLook();
    const hipV = hFovToV(S.fov), adsV = 2 * Math.atan(Math.tan(hipV * DEG / 2) / def.adsZoom) / DEG;
    const ads = smoother(w.adsT);
    let sens = S.sens * CONFIG.INPUT.mouseScale;
    sens *= lerp(1, S.adsMult * Math.tan(adsV * DEG / 2) / Math.tan(hipV * DEG / 2), ads);
    const yawD = dx * sens, pitchD = dy * sens * (S.invertY ? -1 : 1);
    pl.yaw -= yawD; pl.pitch = clamp(pl.pitch - pitchD, -1.53, 1.53);
    if (pitchD > 0 && w.recoverable > 0) w.recoverable = Math.max(0, w.recoverable - pitchD / DEG);
    const yawGain = -yawD / DEG; // degrees the player turned left (+) or right (-) this frame
    if (w.recoverableH > 0 && yawGain > 0) w.recoverableH = Math.max(0, w.recoverableH - yawGain);
    else if (w.recoverableH < 0 && yawGain < 0) w.recoverableH = Math.min(0, w.recoverableH - yawGain);
    this.lookDX = damp(this.lookDX, dx, 30, dt); this.lookDY = damp(this.lookDY, dy, 30, dt);
    // --- movement
    const intent = w.intents();
    pl.update(dt, { adsT: w.adsT, moveMult: def.move.speed, adsMoveMult: def.move.ads, wantsAds: intent.wantsAds, firing: intent.firing });
    if (pl.events.landed > 2.2) {
      const imp = pl.events.landed;
      pl.landSpring.v -= Math.min(imp * 0.16, 2.4);
      Viewmodel.land.v -= Math.min(imp * 0.05, 0.6);
      AudioSys.play('land', { vol: clamp(imp / 9, 0.25, 0.9), send: 0.05 });
      if (imp > 4) AudioSys.play('step_' + (SURF_FX[pl.groundSurf]?.step || 'concrete'), { vol: 0.6, send: 0.05 });
    }
    if (pl.events.jumped) { AudioSys.play('jump', { vol: 0.35, send: 0 }); Viewmodel.land.v += 0.35; }
    if (pl.events.slid) AudioSys.play('slide', { vol: 0.6, send: 0.05 });
    // --- weapon
    w.update(dt, pl, intent);
    // --- camera + viewmodel
    this.updateCamera(dt);
    this.updateVMLighting(dt);
    Viewmodel.update(dt, {
      adsT: w.adsT, sprintT: w.sprintT, crouchT: clamp((CONFIG.MOVE.standHeight - pl.height) / (CONFIG.MOVE.standHeight - CONFIG.MOVE.crouchHeight), 0, 1),
      slide: pl.stance === 'slide', bobPhase: pl.bobPhase, bobAmt: pl.bobAmt, sprinting: pl.sprinting,
      lookDX: this.lookDX, lookDY: this.lookDY, strafe: clamp(pl.vel.dot(pl.right(_v1)) / CONFIG.MOVE.walkSpeed, -1, 1),
      reload: w.reload, magHidden: w.isMagHidden(), vmAdsFov: def.vmAdsFov,
    });
    // --- world
    Range.update(dt); FX.update(dt); FXLights.update(dt);
    AudioSys.updateListener(camera);
    // --- HUD
    const spread = w.currentSpread(pl);
    const gap = Math.tan(spread * DEG) / Math.tan(camera.fov * DEG / 2) * (innerHeight / 2) + 3;
    HUD.crosshair(gap, w.adsT < 0.4 && w.sprintT < 0.5 && !w.reload);
    HUD.update(dt);
    if ((this.frameNo & 7) === 0) {
      const r = this.rangeStats, acc = r.shots ? Math.round((r.hits / r.shots) * 100) : 0;
      HUD.el.rangeStats.textContent = `SHOTS ${r.shots}   HITS ${r.hits}   ACC ${acc}%   HEADSHOTS ${r.heads}   DOWNED ${r.kills}`;
    }
  },
  updateCamera(dt) {
    const pl = this.player, w = PlayerWeapon, S = Save.settings, B = CONFIG.BOB, C = CONFIG.CAMERA;
    const ads = smoother(w.adsT);
    const bobK = pl.bobAmt * S.headBob * lerp(1, 0.2, ads);
    const ph = pl.bobPhase;
    const ampY = pl.sprinting ? B.sprintAmpY : pl.stance === 'crouch' ? B.crouchAmpY : B.walkAmpY;
    const ampX = pl.sprinting ? B.sprintAmpX : B.walkAmpX;
    const by = (Math.sin(ph * 2 - 0.5) * 0.5 + 0.5) * ampY * bobK, bx = Math.sin(ph) * ampX * bobK;
    pl.right(_v1);
    camera.position.set(pl.pos.x + _v1.x * bx, pl.pos.y + pl.eye - by + pl.landSpring.x, pl.pos.z + _v1.z * bx);
    this.slideBlend = damp(this.slideBlend, pl.stance === 'slide' ? 1 : 0, 10, dt);
    const roll = -CONFIG.MOVE.slideRoll * DEG * this.slideBlend + Math.sin(ph) * B.roll * DEG * bobK;
    camera.rotation.set(pl.pitch + w.punch.x, pl.yaw + w.punchYaw, roll, 'YXZ');
    const hipV = hFovToV(S.fov), adsV = 2 * Math.atan(Math.tan(hipV * DEG / 2) / w.def.adsZoom) / DEG;
    let fov = lerp(hipV, adsV, ads) + C.sprintFovAdd * smoother(w.sprintT) * (1 - ads) + C.slideFovAdd * this.slideBlend;
    this.fovCur = damp(this.fovCur, fov, 14, dt);
    if (Math.abs(camera.fov - this.fovCur) > 0.01) { camera.fov = this.fovCur; camera.updateProjectionMatrix(); }
    camera.updateMatrixWorld();
  },
  updateVMLighting(dt) {
    _q1.copy(camera.quaternion).invert();
    vmSun.position.copy(sunDir).applyQuaternion(_q1).multiplyScalar(10); vmSun.target.position.set(0, 0, 0);
    vmHemi.position.set(0, 1, 0).applyQuaternion(_q1);
    vmScene.environmentRotation.setFromQuaternion(_q1);
    if (this.frameNo % 4 === 0) {
      this.vmSunTarget = Collision.raycast(camera.position, sunDir, 90, CF.NO_BULLET) ? 0.07 : 1;
      this.vmIndoorTarget = Collision.raycast(camera.position, UP, 25, CF.NO_BULLET) ? 1 : 0;
    }
    this.vmSunK = damp(this.vmSunK, this.vmSunTarget, 7, dt);
    this.vmIndoor = damp(this.vmIndoor, this.vmIndoorTarget, 4, dt);
    vmSun.intensity = CONFIG.WORLD.sunIntensity * this.vmSunK;
    vmHemi.intensity = CONFIG.WORLD.hemiIntensity * lerp(1, 0.5, this.vmIndoor);
    vmScene.environmentIntensity = CONFIG.WORLD.envIntensity * lerp(1, 0.42, this.vmIndoor);
  },
  updateMenuCamera(dt) {
    this.menuT += dt;
    const t = this.menuT;
    const z = -30 + (1 - Math.cos(t * 0.045)) * 22;
    camera.position.set(-2.6 + Math.sin(t * 0.11) * 1.2, 2.4 + Math.sin(t * 0.07) * 0.3, z);
    camera.rotation.set(-0.04 + Math.sin(t * 0.09) * 0.02, Math.PI + 0.18 + Math.sin(t * 0.05) * 0.25, 0, 'YXZ');
    const v = hFovToV(80);
    if (Math.abs(camera.fov - v) > 0.01) { camera.fov = v; camera.updateProjectionMatrix(); }
    camera.updateMatrixWorld();
  },
  updateFps(dt) {
    this.fpsAcc += dt; this.fpsFrames++;
    if (this.fpsAcc >= 0.5) {
      const fps = this.fpsFrames / this.fpsAcc, ms = (this.fpsAcc / this.fpsFrames) * 1000;
      this.fpsText = `${fps.toFixed(0)} FPS  ${ms.toFixed(1)} ms\n${renderer.info.render.calls} calls  ${(renderer.info.render.triangles / 1000).toFixed(0)}k tris`;
      if (Save.settings.showFps && HUD.el.fps) HUD.el.fps.textContent = this.fpsText;
      this.fpsAcc = 0; this.fpsFrames = 0; this.fps = fps;
    }
  },
};

// Debug / test hooks (used by the headless test harness).
window.__SM = {
  Game, Input, Save, CONFIG, PlayerWeapon, Viewmodel, Collision, Range, FX, renderer, scene, camera, THREE, AudioBuffers: AudioSys.buffers,
  start() { Game.debugNoLock = true; Game.startRange(); },
  hold(action, v = true) { Input.debug[action] = v; },
  press(action) { Input.debugPressed.add(action); },
  look(dx, dy) { Input.dx += dx; Input.dy += dy; },
  teleport(x, y, z, yaw = 0, pitch = 0) { Game.player.spawn(x, y, z, yaw); Game.player.pitch = pitch; },
  /** Freeze simulation and pose the viewmodel explicitly (for screenshots). */
  pose(o = {}) {
    Game.state = 'frozen';
    const w = PlayerWeapon, pl = Game.player;
    const ctx = { adsT: 0, sprintT: 0, crouchT: 0, slide: false, bobPhase: 0, bobAmt: 0, sprinting: false, lookDX: 0, lookDY: 0, strafe: 0, reload: null, magHidden: false, vmAdsFov: w.def.vmAdsFov, ...o };
    if (o.reloadF !== undefined) { const dur = o.empty ? w.def.reloadEmpty : w.def.reloadTac; ctx.reload = { t: o.reloadF * dur, dur, empty: !!o.empty }; const H = (o.empty ? Reload.empty : Reload.tac).hide; ctx.magHidden = o.reloadF > H[0] && o.reloadF < H[1]; }
    w.adsT = ctx.adsT; w.sprintT = ctx.sprintT;
    for (let i = 0; i < 40; i++) { Game.updateCamera(0.05); Game.updateVMLighting(0.05); Viewmodel.update(0.05, ctx); }
    if (o.flash) { Viewmodel.fire(ctx.adsT); Viewmodel.flashT = 10; }
  },
  /** Look at the viewmodel from an orbiting debug camera (tuning aid). */
  vmOrbit(az = 0, el = 0, dist = 0.9, tx = 0.05, ty = -0.12, tz = -0.45) {
    const c = this._vmc || (this._vmc = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 10));
    c.position.set(tx + Math.sin(az) * Math.cos(el) * dist, ty + Math.sin(el) * dist, tz + Math.cos(az) * Math.cos(el) * dist); c.lookAt(tx, ty, tz);
    Post.vmPass.camera = c;
  },
  vmOrbitOff() { Post.vmPass.camera = vmCamera; },
  info() { return { boot: Game.bootTimes, state: Game.state, fps: Game.fps, text: Game.fpsText, world: Game.worldStats, pos: Game.player && Game.player.pos.toArray(), mag: PlayerWeapon.mag, stats: Game.rangeStats }; },
};

Game.boot();
</script>
</body>
